<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>청소 시간 타이머</title>
    
    <!-- React, ReactDOM, Babel 라이브러리 (학교망에서 더 안정적인 cdnjs로 교체) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    
    <!-- localForage (데이터 저장용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 폰트 스타일 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; margin: 0; padding: 0; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        
        /* 유튜브 플레이어 숨김 - 유튜브 정책상 크기가 0이거나 display:none이면 재생을 막으므로 
           크기를 할당한 뒤 화면 밖으로 멀리 보내버립니다. */
        #youtube-player-container { 
            position: absolute; 
            top: -9999px; 
            left: -9999px; 
            width: 300px; 
            height: 300px; 
            opacity: 0.01;
            overflow: hidden;
        }

        /* 스크롤바 숨김 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG 아이콘 모음
        const Play = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M8 5v14l11-7z"/></svg>;
        const Pause = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>;
        const SkipForward = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>;
        const SkipBack = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>;
        const RefreshCw = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const CheckCircle2 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>;
        const Star = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const Maximize = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>;
        const Minimize = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>;
        const Music = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>;
        const YoutubeIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M21.582 6.186a2.618 2.618 0 0 0-1.841-1.854C18.118 3.9 12 3.9 12 3.9s-6.118 0-7.741.432a2.618 2.618 0 0 0-1.841 1.854C2 7.828 2 12 2 12s0 4.172.418 5.814a2.618 2.618 0 0 0 1.841 1.854C5.882 20.1 12 20.1 12 20.1s6.118 0 7.741-.432a2.618 2.618 0 0 0 1.841-1.854C22 16.172 22 12 22 12s0-4.172-.418-5.814zM9.99 15.45V8.55L15.993 12 9.99 15.45z"/></svg>;
        const SearchIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const HomeIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const ImageIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
        const TrashIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        const SettingsIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const PlusIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const XIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        
        // 볼륨 아이콘
        const ArrowUp = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="18 15 12 9 6 15"></polyline></svg>;
        const ArrowDown = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"></polyline></svg>;
        const VolumeX =({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>;
        const Volume1 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>;
        const Volume2 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>;

        const defaultSteps = [
          { title: "책상 위, 서랍 정리하기", time: 50, emoji: "📚✨" },
          { title: "책상 살짝 밀고, 창문 열기", time: 50, emoji: "☀️💨" },
          { title: "청소 도구 챙겨오기", time: 30, emoji: "🏃💨" },
          { title: "책상 아래, 교실 꼼꼼히 쓸기", time: 180, emoji: "♻️✨" },
          { title: "책상 맞추고 청소 도구 정리하기", time: 120, emoji: "🎒📦" },
          { title: "손 씻고 급식 줄서기", time: 180, emoji: "💦🍱" }
        ];

        const bgColors = ['bg-pink-100', 'bg-orange-100', 'bg-yellow-100', 'bg-green-100', 'bg-blue-100', 'bg-purple-100'];

        // 자동 시작 시각 (매일 12시 1분)
        const AUTO_START_HOUR = 12;
        const AUTO_START_MINUTE = 1;

        // 텍스트 안에 들어있는 모든 유튜브 영상 ID 추출 (여러 링크를 한 번에 붙여넣어도 OK)
        function extractAllYouTubeIds(text) {
            const re = /(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/|\/v\/)([A-Za-z0-9_-]{11})/g;
            const ids = [];
            let m;
            while ((m = re.exec(text)) !== null) ids.push(m[1]);
            return ids;
        }

        function App() {
          const [started, setStarted] = useState(false);
          const [currentStep, setCurrentStep] = useState(0);
          
          // 청소 단계 상태화
          const [steps, setSteps] = useState(defaultSteps);
          const [timeLeft, setTimeLeft] = useState(defaultSteps[0].time);
          
          const [isPaused, setIsPaused] = useState(false);
          const [isFullscreen, setIsFullscreen] = useState(false);
          // 주소 끝에 ?auto 가 붙으면(전용 실행 파일로 연 경우) 클릭 없이도 자동 시작·소리 재생
          const [userInteracted, setUserInteracted] = useState(() => new URLSearchParams(window.location.search).has('auto'));
          
          // 설정 모달 관련 상태
          const [isSettingsOpen, setIsSettingsOpen] = useState(false);
          const [settingsTab, setSettingsTab] = useState('steps'); // 'steps' | 'music'
          const [editingSteps, setEditingSteps] = useState([...defaultSteps]);

          // 실시간 날짜/시간 상태
          const [currentTime, setCurrentTime] = useState(new Date());

          // 음악 관련 상태
          // musicMode: 'default'(기본 bgm.mp3) | 'file'(내 MP3) | 'youtube'(유튜브 재생목록)
          const [musicMode, setMusicMode] = useState('default');
          const [fileUrl, setFileUrl] = useState(null);
          const [musicName, setMusicName] = useState("");
          const [youtubeSearchInput, setYoutubeSearchInput] = useState("");
          const [ytPlaylist, setYtPlaylist] = useState([]); // [{ id, title, pending? }]
          const [ytIndex, setYtIndex] = useState(0);
          const [ytApiReady, setYtApiReady] = useState(false);
          const [showSearchGuide, setShowSearchGuide] = useState(false);
          const [autoStartPrompt, setAutoStartPrompt] = useState(false);

          const safeYtIndex = ytPlaylist.length ? Math.min(ytIndex, ytPlaylist.length - 1) : 0;
          const currentYtId = ytPlaylist.length ? ytPlaylist[safeYtIndex].id : "";
          const audioSrc = (musicMode === 'file' && fileUrl) ? fileUrl : "bgm.mp3";
          
          // 볼륨 조절 및 음소거 상태 추가
          const [volume, setVolume] = useState(50); // 0 ~ 100
          const [isMuted, setIsMuted] = useState(false);
          
          // 청소 구역 이미지 상태
          const [cleaningImg, setCleaningImg] = useState(null);
          
          const audioRef = useRef(null);
          const wakeLockRef = useRef(null);
          const fileInputRef = useRef(null);
          const imgInputRef = useRef(null);
          const ytPlayerRef = useRef(null);
          
          const playbackStateRef = useRef({ started: false, isPaused: false, currentStep: 0, userInteracted: false, stepsLength: defaultSteps.length });
          const ytListRef = useRef({ playlist: [], currentId: "" });
          const volumeRef = useRef({ volume: 50, isMuted: false });
          const ytErrorCountRef = useRef(0);
          const lastAutoStartRef = useRef("");

          useEffect(() => {
            playbackStateRef.current = { started, isPaused, currentStep, userInteracted, stepsLength: steps.length };
          }, [started, isPaused, currentStep, userInteracted, steps]);

          useEffect(() => {
            ytListRef.current = { playlist: ytPlaylist, currentId: currentYtId };
          }, [ytPlaylist, currentYtId]);

          const isPlayingNow = () => {
            const s = playbackStateRef.current;
            return s.started && !s.isPaused && s.currentStep < s.stepsLength;
          };

          // 현재 시각 업데이트 (1초마다)
          useEffect(() => {
            const clockTimer = setInterval(() => setCurrentTime(new Date()), 1000);
            return () => clearInterval(clockTimer);
          }, []);

          // 화면 클릭 감지 (자동 재생 권한 획득용)
          useEffect(() => {
            const handleInteraction = () => {
                setUserInteracted(true);
                window.removeEventListener('click', handleInteraction);
                window.removeEventListener('touchstart', handleInteraction);
            };
            window.addEventListener('click', handleInteraction);
            window.addEventListener('touchstart', handleInteraction);

            return () => {
                window.removeEventListener('click', handleInteraction);
                window.removeEventListener('touchstart', handleInteraction);
            };
          }, []);

          // 12시 1분 자동 시작 로직
          // (정확히 0초 한 순간만 보면 탭이 느려졌을 때 놓칠 수 있어서, 12:01 그 1분 동안 하루 한 번만 실행)
          useEffect(() => {
            const checkTimeInterval = setInterval(() => {
                const now = new Date();
                const todayKey = now.toDateString();
                if (now.getHours() === AUTO_START_HOUR && now.getMinutes() === AUTO_START_MINUTE && lastAutoStartRef.current !== todayKey) {
                    lastAutoStartRef.current = todayKey;
                    if (!playbackStateRef.current.started) {
                        if (playbackStateRef.current.userInteracted) {
                            setStarted(true);
                        } else {
                            // 브라우저 정책상 클릭 없이는 소리가 안 나서, 큰 시작 버튼을 띄움
                            setAutoStartPrompt(true);
                        }
                    }
                }
            }, 1000);
            return () => clearInterval(checkTimeInterval);
          }, []);

          // 1. 초기 로딩 시: 저장된 데이터 불러오기
          useEffect(() => {
            // 저장된 단계 불러오기
            localforage.getItem('savedSteps').then((saved) => {
                if (saved && Array.isArray(saved) && saved.length > 0) {
                    setSteps(saved);
                    setEditingSteps(saved);
                    // 앱이 시작되기 전이라면 첫 번째 단계의 시간으로 설정
                    if (!started) {
                        setTimeLeft(saved[0].time);
                    }
                }
            });

            // 음악 불러오기 (모드 / 내 MP3 / 유튜브 재생목록을 따로 저장)
            Promise.all(['savedMusicMode', 'savedBgmFile', 'savedYtPlaylist', 'savedBgmData'].map(k => localforage.getItem(k)))
              .then(([mode, file, list, legacy]) => {
                let pl = Array.isArray(list) ? list.filter(t => t && t.id) : [];
                let m = mode;
                let f = file;
                // 예전 버전(한 곡만 저장하던 방식) 데이터 옮기기
                if (legacy) {
                  if (legacy.type === 'file' && legacy.blob && !f) {
                    f = { blob: legacy.blob, name: legacy.name };
                    localforage.setItem('savedBgmFile', f);
                  }
                  if (legacy.type === 'youtube' && legacy.id && pl.length === 0) {
                    pl = [{ id: legacy.id, title: legacy.title || "유튜브 배경음악" }];
                    localforage.setItem('savedYtPlaylist', pl);
                  }
                  if (!m) m = legacy.type;
                  localforage.setItem('savedMusicMode', m);
                  localforage.removeItem('savedBgmData');
                }
                if (f && f.blob) {
                  setFileUrl(URL.createObjectURL(f.blob));
                  setMusicName(f.name || "나만의 음악");
                }
                setYtPlaylist(pl);
                if (m === 'file' || m === 'youtube') setMusicMode(m);
                pl.filter(t => t.pending).forEach(t => fetchTitle(t.id));
              }).catch(err => console.error("음악 불러오기 실패:", err));

            // 볼륨 불러오기
            localforage.getItem('savedVolume').then((val) => {
              if (val !== null) setVolume(val);
            });
            localforage.getItem('savedMuted').then((val) => {
              if (val !== null) setIsMuted(val);
            });

            // 청소구역 이미지 불러오기
            localforage.getItem('savedCleaningImg').then((blob) => {
              if (blob) {
                setCleaningImg(URL.createObjectURL(blob));
              }
            }).catch(err => console.error("청소 이미지 불러오기 실패:", err));

            // 유튜브 API 세팅
            if (!window.YT) {
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                window.onYouTubeIframeAPIReady = () => {
                    setYtApiReady(true);
                };
            } else {
                setYtApiReady(true);
            }
          }, []);

          // 설정 모달 제어 함수들
          const openSettings = (tab = 'steps') => {
              setEditingSteps([...steps]);
              setSettingsTab(tab);
              setIsSettingsOpen(true);
          };

          const closeSettings = () => {
              setIsSettingsOpen(false);
          };

          const resetSettingsToDefault = () => {
              if(confirm("기본 단계 설정으로 되돌리시겠습니까?")) {
                  setEditingSteps([...defaultSteps]);
              }
          };

          const updateEditingStep = (index, field, value) => {
              // 객체를 복사해서 수정 (원본을 직접 고치면 '취소'해도 변경이 남는 문제가 있었음)
              const newSteps = [...editingSteps];
              newSteps[index] = { ...newSteps[index], [field]: field === 'time' ? Number(value) : value };
              setEditingSteps(newSteps);
          };

          const addStep = () => {
              setEditingSteps([...editingSteps, { title: "새로운 단계", time: 60, emoji: "✨" }]);
          };

          const removeStep = (index) => {
              if (editingSteps.length > 1) {
                  setEditingSteps(editingSteps.filter((_, i) => i !== index));
              } else {
                  alert("최소 1개의 단계는 필요합니다.");
              }
          };

          const saveSettings = () => {
              if (editingSteps.length === 0) {
                  alert("최소 1개의 단계는 필요합니다.");
                  return;
              }
              setSteps(editingSteps);
              localforage.setItem('savedSteps', editingSteps);
              setIsSettingsOpen(false);
              
              // 설정 저장 후 화면 초기화
              setStarted(false);
              setCurrentStep(0);
              setTimeLeft(editingSteps[0].time);
              setIsPaused(false);
              if(audioRef.current) audioRef.current.currentTime = 0;
              if (ytPlayerRef.current && typeof ytPlayerRef.current.seekTo === 'function') ytPlayerRef.current.seekTo(0);
          };

          // 음악 모드 바꾸기 (기본음 / 내 MP3 / 유튜브)
          const changeMode = (mode) => {
            setMusicMode(mode);
            localforage.setItem('savedMusicMode', mode);
          };

          // ---------- 유튜브 재생목록 관리 ----------
          const savePlaylist = (list) => {
            setYtPlaylist(list);
            localforage.setItem('savedYtPlaylist', list);
          };

          // 영상 제목 가져오기 (실패하면 기본 이름)
          const fetchTitle = (id) => {
            fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + id)}&format=json`)
              .then(r => r.ok ? r.json() : Promise.reject())
              .then(d => d.title)
              .catch(() => null)
              .then(title => {
                setYtPlaylist(prev => {
                  const next = prev.map(t => (t.id === id && t.pending) ? { id: t.id, title: title || `유튜브 음악 (${id})` } : t);
                  localforage.setItem('savedYtPlaylist', next);
                  return next;
                });
              });
          };

          const playTrack = (i) => {
            if (i === safeYtIndex && musicMode === 'youtube' && ytPlayerRef.current && typeof ytPlayerRef.current.seekTo === 'function') {
              ytPlayerRef.current.seekTo(0);
            }
            setYtIndex(i);
            if (musicMode !== 'youtube') changeMode('youtube');
          };
          const nextTrack = () => setYtIndex(i => (Math.min(i, ytPlaylist.length - 1) + 1) % ytPlaylist.length);
          const prevTrack = () => setYtIndex(i => (Math.min(i, ytPlaylist.length - 1) - 1 + ytPlaylist.length) % ytPlaylist.length);

          const moveTrack = (i, dir) => {
            const j = i + dir;
            if (j < 0 || j >= ytPlaylist.length) return;
            const next = [...ytPlaylist];
            [next[i], next[j]] = [next[j], next[i]];
            savePlaylist(next);
            if (safeYtIndex === i) setYtIndex(j);
            else if (safeYtIndex === j) setYtIndex(i);
          };

          const removeTrack = (i) => {
            const next = ytPlaylist.filter((_, k) => k !== i);
            savePlaylist(next);
            if (next.length === 0) {
              setYtIndex(0);
              if (ytPlayerRef.current && typeof ytPlayerRef.current.stopVideo === 'function') ytPlayerRef.current.stopVideo();
            } else if (i < safeYtIndex) {
              setYtIndex(safeYtIndex - 1);
            } else if (i === safeYtIndex) {
              setYtIndex(Math.min(safeYtIndex, next.length - 1)); // 다음 곡이 그 자리로 올라옴
            }
          };

          // 볼륨 제어 로직
          useEffect(() => {
              volumeRef.current = { volume, isMuted };
              if (audioRef.current) {
                  audioRef.current.volume = volume / 100;
                  audioRef.current.muted = isMuted;
              }
              if (ytPlayerRef.current && typeof ytPlayerRef.current.setVolume === 'function') {
                  try {
                      ytPlayerRef.current.setVolume(volume);
                      if (isMuted) ytPlayerRef.current.mute();
                      else ytPlayerRef.current.unMute();
                  } catch (e) {}
              }
              
              localforage.setItem('savedVolume', volume);
              localforage.setItem('savedMuted', isMuted);
          }, [volume, isMuted, musicMode]);

          const handleVolumeChange = (e) => {
              const val = Number(e.target.value);
              setVolume(val);
              if (isMuted && val > 0) setIsMuted(false);
          };

          // 유튜브 플레이어: 현재 곡이 바뀌면 불러오기 (재생 중이면 바로 재생, 아니면 대기)
          useEffect(() => {
            if (musicMode !== 'youtube' || !ytApiReady || !currentYtId) return;
            const p = ytPlayerRef.current;
            if (p && typeof p.loadVideoById === 'function') {
                try {
                    const loadedId = p.getVideoData && p.getVideoData().video_id;
                    if (loadedId === currentYtId) {
                        if (isPlayingNow()) {
                            if (p.getPlayerState() === 0) p.seekTo(0);
                            p.playVideo();
                        }
                    } else if (isPlayingNow()) {
                        p.loadVideoById(currentYtId);
                    } else {
                        p.cueVideoById(currentYtId);
                    }
                } catch (e) {}
            } else if (!p) {
                ytPlayerRef.current = new window.YT.Player('youtube-player', {
                    height: '300',
                    width: '300',
                    videoId: currentYtId,
                    playerVars: { 'autoplay': 0, 'controls': 0, 'origin': window.location.origin },
                    events: {
                        'onReady': (event) => {
                            const { volume: v, isMuted: muted } = volumeRef.current;
                            event.target.setVolume(v);
                            if (muted) event.target.mute();
                            // 준비되는 사이에 곡이 바뀌었으면 맞춰주기
                            const curId = ytListRef.current.currentId;
                            const loadedId = event.target.getVideoData && event.target.getVideoData().video_id;
                            if (curId && curId !== loadedId) {
                                if (isPlayingNow()) event.target.loadVideoById(curId); else event.target.cueVideoById(curId);
                            } else if (isPlayingNow()) {
                                event.target.playVideo();
                            }
                        },
                        'onStateChange': (event) => {
                            if (event.data === 1) ytErrorCountRef.current = 0;
                            if (event.data === 0) { // 곡이 끝남
                                const { playlist } = ytListRef.current;
                                if (playlist.length > 1) {
                                    setYtIndex(i => (Math.min(i, playlist.length - 1) + 1) % playlist.length); // 다음 곡 (마지막이면 처음으로)
                                } else if (isPlayingNow()) {
                                    event.target.seekTo(0);
                                    event.target.playVideo();
                                }
                            }
                        },
                        'onError': () => {
                            const { playlist } = ytListRef.current;
                            ytErrorCountRef.current += 1;
                            if (playlist.length > 1 && ytErrorCountRef.current < playlist.length) {
                                setYtIndex(i => (Math.min(i, playlist.length - 1) + 1) % playlist.length); // 재생 안 되는 곡은 건너뛰기
                            } else {
                                ytErrorCountRef.current = 0;
                                alert("재생할 수 없는 유튜브 영상이에요. (저작권 정책으로 외부 재생이 막힌 영상일 수 있어요)\n음악 설정에서 다른 곡을 추가해 주세요!");
                            }
                        }
                    }
                });
            }
          }, [musicMode, ytApiReady, currentYtId, ytIndex]);

          // MP3 파일 업로드
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              localforage.setItem('savedBgmFile', { blob: file, name: file.name }).then(() => {
                if (fileUrl) URL.revokeObjectURL(fileUrl);
                setFileUrl(URL.createObjectURL(file));
                setMusicName(file.name);
                changeMode('file');
              });
            }
            e.target.value = "";
          };

          // 청소 구역 이미지 업로드
          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              localforage.setItem('savedCleaningImg', file).then(() => {
                const fileUrl = URL.createObjectURL(file);
                setCleaningImg(fileUrl);
              });
            }
          };

          // 청소 구역 이미지 지우기
          const handleResetImage = () => {
            localforage.removeItem('savedCleaningImg').then(() => {
                setCleaningImg(null);
                if (imgInputRef.current) imgInputRef.current.value = "";
            });
          };

          // 유튜브 링크를 재생목록에 추가 (여러 개 한 번에 가능) 또는 검색
          const handleYoutubeSubmit = () => {
            const input = youtubeSearchInput.trim();
            if (!input) return;
            const ids = extractAllYouTubeIds(input);
            if (ids.length) {
                const newTracks = ids.map(id => ({ id, title: "제목 불러오는 중...", pending: true }));
                savePlaylist([...ytPlaylist, ...newTracks]);
                if (musicMode !== 'youtube') changeMode('youtube');
                setYoutubeSearchInput("");
                setShowSearchGuide(false);
                [...new Set(ids)].forEach(fetchTitle);
            } else {
                window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(youtubeSearchInput)}`, '_blank');
                setShowSearchGuide(true);
            }
          };

          // 화면 꺼짐 방지
          useEffect(() => {
            const requestWakeLock = async () => {
              try {
                if ('wakeLock' in navigator) wakeLockRef.current = await navigator.wakeLock.request('screen');
              } catch (e) {}
            };
            const releaseWakeLock = async () => {
              if (wakeLockRef.current) { await wakeLockRef.current.release(); wakeLockRef.current = null; }
            };
            if (started && !isPaused) requestWakeLock(); else releaseWakeLock();
            return () => { releaseWakeLock(); };
          }, [started, isPaused]);

          // 전체화면 변경 감지
          useEffect(() => {
            const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
          }, []);

          // 타이머 진행 로직
          useEffect(() => {
            if (!started || isPaused || currentStep >= steps.length) return;
            const timer = setInterval(() => {
              setTimeLeft(prev => {
                if (prev <= 1) {
                  if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
                  handleNext();
                  return 0;
                }
                return prev - 1;
              });
            }, 1000);
            return () => clearInterval(timer);
          }, [started, isPaused, currentStep, steps]);

          // 음악 재생/정지 동기화
          useEffect(() => {
            const isPlayingCondition = started && !isPaused && currentStep < steps.length;
            const ytActive = musicMode === 'youtube' && !!currentYtId;
            const yt = ytPlayerRef.current;
            const ytUsable = yt && typeof yt.getPlayerState === 'function';

            // 기본음 / 내 MP3
            if (audioRef.current) {
                if (!ytActive && musicMode !== 'youtube' && isPlayingCondition) {
                    if (audioRef.current.paused) audioRef.current.play().catch(() => {});
                } else if (!audioRef.current.paused) {
                    audioRef.current.pause();
                }
            }
            // 유튜브
            if (ytUsable) {
                try {
                    const state = yt.getPlayerState();
                    if (ytActive && isPlayingCondition) {
                        if (state === 0) yt.seekTo(0);
                        if (state !== 1 && state !== 3) yt.playVideo();
                    } else if (state === 1 || state === 3) {
                        yt.pauseVideo();
                    }
                } catch (e) {}
            }
          }, [started, isPaused, currentStep, musicMode, steps, currentYtId, audioSrc]);

          const handleNext = () => {
            if (currentStep < steps.length) {
              const nextStep = currentStep + 1;
              setCurrentStep(nextStep);
              if (nextStep < steps.length) setTimeLeft(steps[nextStep].time);
            }
          };
          const handlePrev = () => {
            if (currentStep > 0) {
              const prevStep = currentStep - 1;
              setCurrentStep(prevStep);
              setTimeLeft(steps[prevStep].time);
            }
          };
          
          // 타임라인 클릭으로 시간 직접 조절하기
          const handleProgressClick = (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = Math.max(0, Math.min(1, clickX / rect.width));
            const newTimeLeft = Math.round(steps[currentStep].time * percentage);
            setTimeLeft(newTimeLeft > 0 ? newTimeLeft : 1);
          };
          
          // 처음(홈)으로 되돌아가기
          const handleRestart = () => {
            setStarted(false);
            setCurrentStep(0);
            setTimeLeft(steps[0].time);
            setIsPaused(false);
            if(audioRef.current) audioRef.current.currentTime = 0;
            if (ytPlayerRef.current && typeof ytPlayerRef.current.seekTo === 'function') ytPlayerRef.current.seekTo(0);
          };

          const toggleFullscreen = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else if (document.exitFullscreen) document.exitFullscreen();
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
          };

          // 시계 표시용 문자열 생성
          const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
          const dateStr = `${currentTime.getFullYear()}년 ${currentTime.getMonth() + 1}월 ${currentTime.getDate()}일 (${daysOfWeek[currentTime.getDay()]}요일)`;
          const timeStr = currentTime.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          const currentBgColor = currentStep < steps.length ? bgColors[currentStep % bgColors.length] : 'bg-green-100';

          // 볼륨 조절 줄 (음악 설정창용)
          const renderVolumeRow = () => (
            <div className="flex items-center gap-3 bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3">
                <button onClick={() => setIsMuted(!isMuted)} className="p-1 text-gray-600 hover:text-blue-500 transition-colors" title="음소거">
                    {isMuted || volume === 0 ? <VolumeX className="w-6 h-6 text-red-500" /> : volume < 50 ? <Volume1 className="w-6 h-6" /> : <Volume2 className="w-6 h-6" />}
                </button>
                <input type="range" min="0" max="100" value={isMuted ? 0 : volume} onChange={handleVolumeChange}
                    className="flex-1 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-blue-500" title="볼륨 조절" />
                <span className="w-10 text-right text-gray-500 font-sans text-sm">{isMuted ? 0 : volume}</span>
            </div>
          );

          // 음악 설정 패널 (시작 화면과 '음악 설정' 창에서 같이 사용)
          const renderMusicPanel = () => (
            <div className="flex flex-col gap-4">
                {/* 음악 종류 선택 */}
                <div className="grid grid-cols-3 gap-1 bg-gray-200 p-1 rounded-2xl">
                    {[['default', '🎵 기본음'], ['file', '💾 내 MP3'], ['youtube', '▶️ 유튜브']].map(([m, label]) => (
                        <button key={m} onClick={() => changeMode(m)}
                            className={`py-2 rounded-xl text-sm md:text-base transition ${musicMode === m ? 'bg-white shadow text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>
                            {label}
                        </button>
                    ))}
                </div>

                {musicMode === 'default' && (
                    <p className="text-gray-500 text-sm text-center py-4">선생님 기본 배경음을 재생해요.</p>
                )}

                {musicMode === 'file' && (
                    <div className="flex flex-col gap-3 items-center py-2">
                        {fileUrl ? (
                            <p className="text-green-600 font-bold text-sm bg-green-100 px-4 py-2 rounded-full inline-flex items-center gap-2 max-w-full">
                                <Music className="w-5 h-5 flex-shrink-0" /><span className="truncate">{musicName}</span>
                            </p>
                        ) : (
                            <p className="text-gray-400 text-sm text-center">아직 고른 MP3가 없어요. (고르기 전엔 기본음이 나와요)</p>
                        )}
                        <button onClick={() => { if (fileInputRef.current) fileInputRef.current.click(); }}
                            className="flex items-center justify-center gap-2 w-full bg-white border-2 border-blue-400 text-blue-500 hover:bg-blue-50 py-3 px-6 rounded-xl transition shadow-sm">
                            <Music className="w-5 h-5" /> {fileUrl ? '다른 MP3로 바꾸기' : '내 컴퓨터 MP3 선택'}
                        </button>
                    </div>
                )}

                {musicMode === 'youtube' && (
                    <div className="flex flex-col gap-3">
                        <div className="flex gap-2">
                            <input
                                type="text"
                                placeholder="유튜브 주소 붙여넣기 (여러 개 OK) 또는 검색어"
                                value={youtubeSearchInput}
                                onChange={(e) => setYoutubeSearchInput(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && handleYoutubeSubmit()}
                                className="flex-1 px-4 py-3 rounded-xl border-2 border-gray-300 focus:border-red-400 outline-none font-sans text-sm shadow-sm min-w-0"
                            />
                            <button onClick={handleYoutubeSubmit}
                                className="bg-red-500 hover:bg-red-600 text-white px-4 rounded-xl flex items-center gap-1 transition shadow-sm whitespace-nowrap">
                                {extractAllYouTubeIds(youtubeSearchInput).length ? <><PlusIcon className="w-5 h-5" /> 추가</> : <><SearchIcon className="w-5 h-5" /> 검색</>}
                            </button>
                        </div>

                        {showSearchGuide && (
                            <div className="p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-xs md:text-sm animate-fade-in-up flex flex-col gap-2">
                                <p className="font-bold">✨ 새 창에 결과가 열렸습니다!</p>
                                <p>1. 열린 창에서 원하는 곡을 클릭하세요.</p>
                                <p>2. 해당 영상의 <b>주소(URL)를 복사</b>하세요.</p>
                                <p>3. 위 빈칸에 붙여넣고 <b>[추가]</b>를 누르세요. 여러 곡을 계속 추가할 수 있어요!</p>
                                <button onClick={() => setShowSearchGuide(false)} className="mt-1 self-end text-red-400 hover:text-red-600 underline">닫기</button>
                            </div>
                        )}

                        {ytPlaylist.length === 0 ? (
                            <p className="text-gray-400 text-sm text-center py-3">유튜브 주소를 추가하면 재생목록이 만들어져요.<br />위에서부터 순서대로, 끝나면 다시 처음부터 재생돼요!</p>
                        ) : (
                            <>
                                <div className="flex items-center justify-between text-sm text-gray-500 px-1">
                                    <span>📃 재생목록 {ytPlaylist.length}곡 · 순서대로 재생</span>
                                </div>
                                <ul className="flex flex-col gap-2 max-h-56 overflow-y-auto hide-scrollbar">
                                    {ytPlaylist.map((t, i) => {
                                        const active = i === safeYtIndex;
                                        return (
                                            <li key={t.id + '-' + i} className={`flex items-center gap-1 p-2 rounded-xl border ${active ? 'bg-red-50 border-red-300' : 'bg-white border-gray-200'}`}>
                                                <button onClick={() => playTrack(i)} className="flex items-center gap-2 flex-1 min-w-0 text-left" title="이 곡으로 바꾸기">
                                                    <span className={`w-6 text-center shrink-0 font-bold ${active ? 'text-red-500' : 'text-gray-400'}`}>{active ? '♪' : i + 1}</span>
                                                    <img src={`https://i.ytimg.com/vi/${t.id}/default.jpg`} alt="" onError={(e) => { e.currentTarget.style.visibility = 'hidden'; }}
                                                        className="w-12 h-9 object-cover rounded-md shrink-0 bg-gray-200" />
                                                    <span className={`truncate font-sans text-sm ${active ? 'text-red-600 font-bold' : 'text-gray-700'}`}>{t.title}</span>
                                                </button>
                                                <button onClick={() => moveTrack(i, -1)} disabled={i === 0} title="위로"
                                                    className={`p-1 rounded-lg shrink-0 ${i === 0 ? 'text-gray-200' : 'text-gray-500 hover:bg-gray-100'}`}><ArrowUp className="w-5 h-5" /></button>
                                                <button onClick={() => moveTrack(i, 1)} disabled={i === ytPlaylist.length - 1} title="아래로"
                                                    className={`p-1 rounded-lg shrink-0 ${i === ytPlaylist.length - 1 ? 'text-gray-200' : 'text-gray-500 hover:bg-gray-100'}`}><ArrowDown className="w-5 h-5" /></button>
                                                <button onClick={() => removeTrack(i)} title="목록에서 빼기"
                                                    className="p-1 rounded-lg shrink-0 text-red-400 hover:text-red-600 hover:bg-red-50"><XIcon className="w-5 h-5" /></button>
                                            </li>
                                        );
                                    })}
                                </ul>
                                {ytPlaylist.length > 1 && (
                                    <div className="flex justify-center gap-3">
                                        <button onClick={prevTrack} className="flex items-center gap-1 px-4 py-2 bg-white border border-gray-300 rounded-full text-gray-600 hover:bg-gray-50 text-sm shadow-sm">
                                            <SkipBack className="w-4 h-4" /> 이전 곡
                                        </button>
                                        <button onClick={nextTrack} className="flex items-center gap-1 px-4 py-2 bg-white border border-gray-300 rounded-full text-gray-600 hover:bg-gray-50 text-sm shadow-sm">
                                            다음 곡 <SkipForward className="w-4 h-4" />
                                        </button>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                )}
            </div>
          );

          return (
            <div className={`min-h-screen flex flex-col items-center justify-center transition-colors duration-1000 ${currentBgColor} p-4 relative`}>
              
              {/* 12시 자동 시작 안내 띠 */}
              {!started && !userInteracted && (
                <div className="fixed top-0 left-0 w-full bg-red-500 text-white text-center py-2 z-[100] text-sm md:text-base animate-pulse cursor-pointer shadow-md">
                    ⚠️ 12시 1분 자동 시작을 위해 화면 아무 곳이나 한 번 클릭해주세요!
                </div>
              )}

              {/* 12시 1분이 됐는데 아직 화면 클릭을 안 한 경우: 큰 시작 버튼 */}
              {autoStartPrompt && !started && (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[120] flex justify-center items-center p-4">
                    <button
                        onClick={() => { setAutoStartPrompt(false); setStarted(true); }}
                        className="bg-white rounded-[3rem] p-10 md:p-16 shadow-2xl text-center animate-fade-in-up hover:scale-105 transition-transform"
                    >
                        <div className="text-7xl mb-6 animate-bounce">🧹</div>
                        <div className="text-4xl md:text-5xl text-gray-800 mb-4">청소 시간이에요!</div>
                        <div className="text-2xl text-blue-500">여기를 눌러서 시작하기 🚀</div>
                    </button>
                </div>
              )}

              {/* 좌측 상단: 현재 시계 */}
              <div className="absolute top-4 left-4 md:top-6 md:left-6 bg-white/60 backdrop-blur-md px-4 py-2 rounded-2xl shadow-sm text-gray-700 text-center z-50">
                  <div className="text-xs md:text-sm text-gray-500">{dateStr}</div>
                  <div className="text-lg md:text-2xl font-bold">{timeStr}</div>
              </div>

              {/* 우측 상단: 컨트롤 버튼 영역 (볼륨 + 홈 + 설정 + 전체화면) */}
              <div className="absolute top-4 right-4 md:top-6 md:right-6 flex items-center gap-2 md:gap-3 z-50">
                  
                  {/* 볼륨 조절 컨트롤 */}
                  <div className="flex items-center gap-1 md:gap-2 bg-white/60 backdrop-blur-md px-3 py-2 rounded-full shadow-sm transition-all group hover:bg-white/90 hidden sm:flex">
                      <button onClick={() => setIsMuted(!isMuted)} className="p-1 text-gray-600 hover:text-blue-500 transition-colors" title="음소거">
                          {isMuted || volume === 0 ? <VolumeX className="w-5 h-5 md:w-6 md:h-6 text-red-500" /> : volume < 50 ? <Volume1 className="w-5 h-5 md:w-6 md:h-6" /> : <Volume2 className="w-5 h-5 md:w-6 md:h-6" />}
                      </button>
                      <input 
                          type="range" 
                          min="0" 
                          max="100" 
                          value={isMuted ? 0 : volume} 
                          onChange={handleVolumeChange}
                          className="w-16 md:w-24 h-1.5 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-blue-500 opacity-70 group-hover:opacity-100 transition-opacity"
                          title="볼륨 조절"
                      />
                  </div>

                  {started && (
                      <button 
                          onClick={handleRestart} 
                          className="p-2 md:p-3 bg-white/60 hover:bg-white/90 rounded-full shadow-sm transition-all"
                          title="홈(처음)으로"
                      >
                          <HomeIcon className="w-5 h-5 md:w-6 md:h-6 text-gray-700" />
                      </button>
                  )}
                  
                  {/* 음악 설정 버튼 (청소 중에도 언제든지) */}
                  <button
                      onClick={() => openSettings('music')}
                      className="p-2 md:p-3 bg-white/60 hover:bg-white/90 rounded-full shadow-sm transition-all"
                      title="음악 설정"
                  >
                      <Music className="w-5 h-5 md:w-6 md:h-6 text-gray-700" />
                  </button>

                  {/* 톱니바퀴 설정 버튼 */}
                  <button 
                      onClick={() => openSettings('steps')}
                      className="p-2 md:p-3 bg-white/60 hover:bg-white/90 rounded-full shadow-sm transition-all"
                      title="설정 (청소 단계 · 음악)"
                  >
                      <SettingsIcon className="w-5 h-5 md:w-6 md:h-6 text-gray-700" />
                  </button>

                  <button 
                      onClick={toggleFullscreen} 
                      className="p-2 md:p-3 bg-white/60 hover:bg-white/90 rounded-full shadow-sm transition-all"
                      title="전체화면"
                  >
                      {isFullscreen ? <Minimize className="w-5 h-5 md:w-6 md:h-6 text-gray-700" /> : <Maximize className="w-5 h-5 md:w-6 md:h-6 text-gray-700" />}
                  </button>
              </div>

              {/* ======================= 설정 모달 ======================= */}
              {isSettingsOpen && (
                  <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[110] flex justify-center items-center p-4">
                      <div className="bg-white rounded-3xl p-6 md:p-8 w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl animate-fade-in-up">
                          <div className="flex justify-between items-center mb-4">
                              <h2 className="text-2xl font-bold text-gray-800">⚙️ 설정</h2>
                              <button onClick={closeSettings} className="p-2 hover:bg-gray-100 rounded-full transition text-gray-500">
                                  <XIcon className="w-6 h-6" />
                              </button>
                          </div>

                          {/* 탭: 청소 단계 / 음악 */}
                          <div className="grid grid-cols-2 gap-1 bg-gray-100 p-1 rounded-2xl mb-5">
                              {[['steps', '🧹 청소 단계'], ['music', '🎵 음악']].map(([t, label]) => (
                                  <button key={t} onClick={() => setSettingsTab(t)}
                                      className={`py-2 rounded-xl text-lg transition ${settingsTab === t ? 'bg-white shadow text-gray-800' : 'text-gray-500 hover:text-gray-700'}`}>
                                      {label}
                                  </button>
                              ))}
                          </div>

                          {settingsTab === 'music' ? (
                            <>
                              <div className="overflow-y-auto flex-1 pr-2 hide-scrollbar flex flex-col gap-4">
                                  {renderMusicPanel()}
                                  {renderVolumeRow()}
                              </div>
                              <div className="mt-6 pt-4 border-t border-gray-200 flex items-center justify-between gap-3">
                                  <p className="text-gray-400 text-xs md:text-sm">음악은 바로 바뀌어요. 청소 타이머는 그대로 계속 흘러가요!</p>
                                  <button onClick={closeSettings} className="px-6 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600 transition font-bold shadow-md shrink-0">닫기</button>
                              </div>
                            </>
                          ) : (
                          <>
                          {started && (
                              <p className="mb-3 text-sm text-orange-600 bg-orange-50 border border-orange-200 rounded-xl px-4 py-2">
                                  ⚠️ 청소 단계를 바꿔서 저장하면 타이머가 처음 화면으로 돌아가요. (음악만 바꾸려면 🎵 음악 탭을 쓰세요)
                              </p>
                          )}
                          <div className="overflow-y-auto flex-1 pr-2 hide-scrollbar flex flex-col gap-3">
                              {editingSteps.map((step, idx) => (
                                  <div key={idx} className="flex flex-col sm:flex-row gap-2 items-center bg-gray-50 p-3 rounded-xl border border-gray-200">
                                      <span className="font-bold text-blue-500 w-6 text-center shrink-0">{idx + 1}</span>
                                      <input 
                                          type="text" 
                                          value={step.emoji} 
                                          onChange={(e) => updateEditingStep(idx, 'emoji', e.target.value)} 
                                          className="w-16 p-2 rounded-lg border border-gray-300 text-center text-xl outline-none focus:border-blue-400 shrink-0"
                                          title="이모티콘"
                                      />
                                      <input 
                                          type="text" 
                                          value={step.title} 
                                          onChange={(e) => updateEditingStep(idx, 'title', e.target.value)} 
                                          className="flex-1 p-2 rounded-lg border border-gray-300 outline-none focus:border-blue-400 w-full"
                                          placeholder="단계 이름 입력"
                                      />
                                      <div className="flex items-center gap-2 w-full sm:w-auto shrink-0 justify-end">
                                          <input 
                                              type="number" 
                                              value={step.time} 
                                              onChange={(e) => updateEditingStep(idx, 'time', Math.max(1, e.target.value))} 
                                              className="w-20 p-2 rounded-lg border border-gray-300 text-right outline-none focus:border-blue-400"
                                              min="1"
                                              title="시간(초)"
                                          />
                                          <span className="text-gray-600 font-sans text-sm">초</span>
                                          <button onClick={() => removeStep(idx)} className="p-2 text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition" title="단계 삭제">
                                              <TrashIcon className="w-5 h-5" />
                                          </button>
                                      </div>
                                  </div>
                              ))}
                              
                              <button onClick={addStep} className="mt-2 py-3 border-2 border-dashed border-blue-300 text-blue-500 rounded-xl hover:bg-blue-50 transition flex items-center justify-center gap-2 font-bold">
                                  <PlusIcon className="w-5 h-5" /> 새로운 단계 추가하기
                              </button>
                          </div>
                          
                          <div className="mt-6 pt-4 border-t border-gray-200 flex flex-wrap justify-between gap-4 items-center">
                              <button onClick={resetSettingsToDefault} className="text-gray-500 underline hover:text-gray-700 text-sm">기본 설정으로 되돌리기</button>
                              <div className="flex gap-2 w-full sm:w-auto">
                                  <button onClick={closeSettings} className="flex-1 sm:flex-none px-6 py-2 bg-gray-200 text-gray-700 rounded-xl hover:bg-gray-300 transition">취소</button>
                                  <button onClick={saveSettings} className="flex-1 sm:flex-none px-6 py-2 bg-blue-500 text-white rounded-xl hover:bg-blue-600 transition font-bold shadow-md">저장하기</button>
                              </div>
                          </div>
                          </>
                          )}
                      </div>
                  </div>
              )}

              {/* 보이지 않는 오디오 / 유튜브 플레이어 */}
              <input type="file" accept="audio/*" onChange={handleFileUpload} ref={fileInputRef} className="hidden" />
              <audio ref={audioRef} src={audioSrc} loop />
              <div id="youtube-player-container"><div id="youtube-player"></div></div>

              {/* ======================= 시작(홈) 화면 ======================= */}
              {!started && (
                <div className="bg-white/90 backdrop-blur-md rounded-[3rem] p-8 md:p-12 shadow-2xl text-center max-w-4xl w-full border-4 border-white mt-24 md:mt-0 flex flex-col animate-fade-in-up">
                  <div className="flex justify-center mb-6">
                    <Star className="w-20 h-20 text-yellow-400 fill-yellow-400 animate-pulse" />
                  </div>
                  <h1 className="text-5xl md:text-6xl text-gray-800 mb-4 drop-shadow-sm">신나는 청소 시간!</h1>
                  <p className="text-xl text-gray-600 mb-3">다 함께 교실을 반짝반짝하게 만들어봐요 ✨</p>
                  <p className="text-base text-blue-500 mb-10">⏰ 매일 {AUTO_START_HOUR}시 {AUTO_START_MINUTE}분에 자동으로 시작돼요</p>
                  
                  {/* 설정 패널 영역 (2단 그리드 분리) */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 flex-1">
                      
                      {/* [패널 1] 음악 설정 */}
                      <div className="p-6 bg-gray-50 rounded-3xl border border-gray-200 shadow-inner text-left flex flex-col h-full">
                        <p className="text-xl text-gray-700 mb-4 text-center">🎵 우리 반 청소 음악 설정</p>
                        {renderMusicPanel()}
                      </div>

                      {/* [패널 2] 청소 구역 이미지 업로드 */}
                      <div className="p-6 bg-gray-50 rounded-3xl border border-gray-200 shadow-inner text-left flex flex-col h-full justify-between">
                        <div>
                            <p className="text-xl text-gray-700 mb-4 text-center">📋 우리 반 청소 구역표 등록</p>
                            <input type="file" accept="image/*" onChange={handleImageUpload} ref={imgInputRef} className="hidden" />
                            <button 
                                onClick={() => { if (imgInputRef.current) imgInputRef.current.click(); }}
                                className="flex items-center justify-center gap-2 w-full bg-white border-2 border-emerald-400 text-emerald-500 hover:bg-emerald-50 py-3 px-6 rounded-xl transition shadow-sm"
                            >
                                <ImageIcon className="w-5 h-5" /> 컴퓨터에서 이미지 선택하기
                            </button>
                        </div>
                        
                        <div className="flex flex-col items-center justify-center mt-4 flex-1">
                            {cleaningImg ? (
                                <div className="flex flex-col items-center gap-3 w-full">
                                    <div className="relative w-full max-h-[140px] overflow-hidden rounded-xl border border-gray-300 shadow-sm flex justify-center bg-gray-200">
                                        <img src={cleaningImg} alt="청소 구역 미리보기" className="h-[140px] w-auto object-contain" />
                                    </div>
                                    <button onClick={handleResetImage} className="flex items-center gap-1 text-sm text-gray-500 underline hover:text-red-500 transition">
                                      <TrashIcon className="w-4 h-4" /> 이미지 지우기
                                    </button>
                                </div>
                            ) : (
                                <p className="text-gray-400 text-sm text-center">이미지를 올리면 타이머 화면 오른쪽에<br/>청소 구역이 계속 띄워져 있게 됩니다!</p>
                            )}
                        </div>
                      </div>
                  </div>

                  <button onClick={() => setStarted(true)} className="bg-blue-400 hover:bg-blue-500 text-white text-3xl py-5 px-12 rounded-full shadow-lg transform transition hover:scale-105 hover:-translate-y-1 w-full mt-auto">
                    청소 시작하기 🚀
                  </button>
                </div>
              )}

              {/* ======================= 진행 & 완료 화면 ======================= */}
              {started && (
                <div className="flex flex-col lg:flex-row gap-8 items-center justify-center w-full max-w-[90rem] mt-28 md:mt-0 z-10 px-4">
                  
                  {/* [좌측] 타이머 & 완료 박스 */}
                  <div className="flex-1 flex justify-center w-full min-w-0">
                    {currentStep < steps.length ? (
                      <div className="bg-white/90 backdrop-blur-md rounded-[3rem] p-8 md:p-12 shadow-2xl text-center w-full max-w-3xl border-4 border-white relative overflow-hidden animate-fade-in-up">
                        <div className="absolute top-0 left-0 h-3 bg-gray-100 w-full">
                          <div className="h-full bg-blue-400 transition-all duration-1000" style={{ width: `${((currentStep + 1) / steps.length) * 100}%` }}></div>
                        </div>
                        <div className="mt-4 mb-4">
                          <span className="bg-white text-blue-500 px-6 py-2 rounded-full text-2xl font-bold shadow-sm border-2 border-blue-100">{currentStep + 1} / {steps.length} 단계</span>
                        </div>
                        <h2 className="text-4xl md:text-5xl text-gray-800 mt-8 mb-4 leading-tight break-keep">{steps[currentStep].title}</h2>
                        <div className="text-7xl mb-8 animate-bounce">{steps[currentStep].emoji}</div>
                        <div className="my-8 relative">
                          <div className="text-8xl md:text-9xl font-bold text-gray-700 drop-shadow-md tracking-wider">{formatTime(timeLeft)}</div>
                          
                          {/* 클릭 가능한 타임라인 (마우스 오버 시 도톰해지는 애니메이션 적용) */}
                          <div 
                            className="w-full h-10 mt-6 flex items-center cursor-pointer group" 
                            onClick={handleProgressClick}
                            title="원하는 위치를 클릭해서 시간을 조절하세요"
                          >
                            <div className="w-full bg-gray-200 h-4 rounded-full overflow-hidden shadow-inner group-hover:h-6 transition-all duration-300">
                              <div 
                                className="h-full bg-pink-400 transition-all duration-300 ease-out rounded-full group-hover:bg-pink-500" 
                                style={{ width: `${(timeLeft / steps[currentStep].time) * 100}%` }}
                              ></div>
                            </div>
                          </div>

                        </div>
                        <div className="flex items-center justify-center gap-6 mt-10">
                          <button onClick={handlePrev} disabled={currentStep === 0} className={`p-4 rounded-full transition-transform hover:scale-110 shadow-md ${currentStep === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-gray-50'}`}>
                            <SkipBack className="w-8 h-8 md:w-10 md:h-10" />
                          </button>
                          <button onClick={() => setIsPaused(!isPaused)} className="bg-yellow-400 hover:bg-yellow-500 text-white p-6 rounded-full shadow-lg transition-transform hover:scale-110">
                            {isPaused ? <Play className="w-12 h-12 md:w-14 md:h-14 fill-white" /> : <Pause className="w-12 h-12 md:w-14 md:h-14 fill-white" />}
                          </button>
                          <button onClick={handleNext} className="p-4 rounded-full bg-white text-gray-700 hover:bg-gray-50 shadow-md transition-transform hover:scale-110">
                            <SkipForward className="w-8 h-8 md:w-10 md:h-10" />
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="bg-white/95 backdrop-blur-md rounded-[3rem] p-12 shadow-2xl text-center w-full max-w-2xl border-4 border-green-200 animate-fade-in-up">
                        <div className="flex justify-center mb-8"><CheckCircle2 className="w-24 h-24 text-green-500" /></div>
                        <h1 className="text-4xl md:text-5xl text-green-600 mb-8 leading-snug break-keep">우리 반을 깨끗하게 해줘서<br/>고마워! 💖</h1>
                        <p className="text-3xl text-gray-700 mb-12 bg-green-50 p-6 rounded-2xl break-keep">점심 맛있게 먹고<br/>5교시 수업을 준비해주세요! 🍱</p>
                        <button onClick={handleRestart} className="flex items-center justify-center gap-3 bg-gray-800 hover:bg-gray-900 text-white text-2xl py-4 px-10 rounded-full mx-auto shadow-xl transition transform hover:scale-105">
                          <RefreshCw className="w-7 h-7" /> 처음부터 다시 하기
                        </button>
                      </div>
                    )}
                  </div>

                  {/* [우측] 청소 구역 이미지 패널 (이미지가 업로드 된 경우에만 표시) */}
                  {cleaningImg && (
                    <div className="w-full lg:w-[450px] xl:w-[500px] bg-white/90 backdrop-blur-md rounded-[3rem] p-6 shadow-2xl border-4 border-white flex flex-col items-center animate-fade-in-up flex-shrink-0 lg:max-h-[85vh]">
                        <div className="bg-emerald-100 text-emerald-700 font-bold px-8 py-3 rounded-full mb-4 text-2xl shadow-sm border-2 border-emerald-200 flex-shrink-0 whitespace-nowrap">
                            📋 이달의 청소 구역
                        </div>
                        {/* 이미지 영역 (가로/세로 비율을 최대한 유지하며 넘칠 경우 안에서만 스크롤 되도록 설정) */}
                        <div className="w-full flex-1 overflow-y-auto rounded-2xl bg-gray-50 flex items-start justify-center p-2 border border-gray-200 hide-scrollbar shadow-inner">
                            <img src={cleaningImg} alt="청소 구역" className="w-full h-auto rounded-xl object-contain" />
                        </div>
                    </div>
                  )}

                </div>
              )}
            </div>
          );
        }

        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', backgroundColor: '#fee2e2', padding: '2rem', fontFamily: '"Jua", sans-serif' }}>
                            <h1 style={{ fontSize: '3rem', color: '#dc2626', marginBottom: '1rem' }}>⚠️ 화면 오류 발생!</h1>
                            <p style={{ fontSize: '1.5rem', color: '#4b5563', marginBottom: '2rem', textAlign: 'center', lineHeight: '1.5' }}>
                                브라우저에 저장된 이전 설정 데이터가 엉켰거나<br/>학교 인터넷망 접속이 일시적으로 불안정합니다.
                            </p>
                            <button 
                                onClick={() => {
                                    if(window.localforage) {
                                        localforage.clear().then(() => window.location.reload());
                                    } else {
                                        localStorage.clear();
                                        window.location.reload();
                                    }
                                }} 
                                style={{ padding: '1rem 2rem', fontSize: '1.5rem', backgroundColor: '#ef4444', color: 'white', border: 'none', borderRadius: '999px', cursor: 'pointer', boxShadow: '0 4px 6px rgba(0,0,0,0.1)' }}
                            >
                                🔄 모든 설정 초기화하고 고치기
                            </button>
                            <p style={{ marginTop: '2rem', color: '#ef4444', fontSize: '0.875rem' }}>
                                (오류 상세 내역: {this.state.error?.toString()})
                            </p>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>

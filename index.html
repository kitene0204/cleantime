<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>청소 시간 타이머</title>
    
    <!-- React, ReactDOM, Babel 라이브러리 불러오기 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- localForage 라이브러리 (브라우저에 대용량 파일 저장 용도) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <!-- Tailwind CSS (스타일링) 불러오기 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 폰트 스타일 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; margin: 0; padding: 0; }
        /* 애니메이션 추가 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React 코드를 브라우저가 읽을 수 있도록 번역(Babel) -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG 아이콘 직접 정의 (깨짐 방지)
        const Play = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M8 5v14l11-7z"/></svg>;
        const Pause = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>;
        const SkipForward = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>;
        const SkipBack = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>;
        const RefreshCw = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const CheckCircle2 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>;
        const Star = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const Maximize = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>;
        const Minimize = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>;
        const Music = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>;

        // 청소 단계 데이터 설정
        const steps = [
          { title: "책상 위, 서랍 정리하기", time: 50, emoji: "📚✨" },
          { title: "책상 살짝 밀고, 창문 열기", time: 50, emoji: "☀️💨" },
          { title: "청소 도구 챙겨오기", time: 30, emoji: "🏃💨" },
          { title: "책상 아래, 교실 꼼꼼히 쓸기", time: 180, emoji: "♻️✨" },
          { title: "책상 맞추고 청소 도구 정리하기", time: 120, emoji: "🎒📦" },
          { title: "손 씻고 급식 줄서기", time: 180, emoji: "💦🍱" }
        ];

        // 단계별 파스텔 배경색 배열
        const bgColors = [
          'bg-pink-100', 'bg-orange-100', 'bg-yellow-100', 
          'bg-green-100', 'bg-blue-100', 'bg-purple-100'
        ];

        function App() {
          const [started, setStarted] = useState(false);
          const [currentStep, setCurrentStep] = useState(0);
          const [timeLeft, setTimeLeft] = useState(steps[0].time);
          const [isPaused, setIsPaused] = useState(false);
          const [isFullscreen, setIsFullscreen] = useState(false);
          
          // 기본 오디오 소스 설정 (같은 폴더의 bgm.mp3)
          const [audioSrc, setAudioSrc] = useState("bgm.mp3");
          const [hasSavedMusic, setHasSavedMusic] = useState(false);
          const [musicName, setMusicName] = useState("");
          
          const audioRef = useRef(null);
          const wakeLockRef = useRef(null);
          const fileInputRef = useRef(null);

          // 첫 로딩 시: 브라우저에 저장된 음악 파일이 있는지 확인하여 불러오기
          useEffect(() => {
            localforage.getItem('savedBgm').then((savedData) => {
              if (savedData && savedData.blob) {
                const fileUrl = URL.createObjectURL(savedData.blob);
                setAudioSrc(fileUrl);
                setHasSavedMusic(true);
                setMusicName(savedData.name || "나만의 음악");
              }
            }).catch(err => console.error("음악 불러오기 실패:", err));
          }, []);

          // 음원 파일 업로드 및 브라우저에 저장 핸들러
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              // 브라우저 저장소(IndexedDB)에 파일 보관
              localforage.setItem('savedBgm', { blob: file, name: file.name }).then(() => {
                const fileUrl = URL.createObjectURL(file);
                setAudioSrc(fileUrl);
                setHasSavedMusic(true);
                setMusicName(file.name);
              }).catch(err => {
                console.error("음악 저장 실패:", err);
                // 저장에 실패하더라도 이번 한 번은 재생될 수 있게 처리
                const fileUrl = URL.createObjectURL(file);
                setAudioSrc(fileUrl);
                setHasSavedMusic(true);
                setMusicName(file.name);
              });
            }
          };

          // 저장된 음악 삭제하고 기본 파일(bgm.mp3)로 되돌리기
          const handleResetMusic = () => {
            localforage.removeItem('savedBgm').then(() => {
              setAudioSrc("bgm.mp3");
              setHasSavedMusic(false);
              setMusicName("");
            });
          };

          // 화면 꺼짐 방지 및 전체화면 이벤트
          useEffect(() => {
            const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
            document.addEventListener('fullscreenchange', handleFullscreenChange);

            return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
          }, []);

          useEffect(() => {
            const requestWakeLock = async () => {
              try {
                if ('wakeLock' in navigator) {
                  wakeLockRef.current = await navigator.wakeLock.request('screen');
                }
              } catch (err) {
                console.log("Wake Lock error:", err);
              }
            };

            const releaseWakeLock = async () => {
              if (wakeLockRef.current !== null) {
                await wakeLockRef.current.release();
                wakeLockRef.current = null;
              }
            };

            if (started && !isPaused) {
              requestWakeLock();
            } else {
              releaseWakeLock();
            }

            return () => { releaseWakeLock(); };
          }, [started, isPaused]);

          // 타이머 로직
          useEffect(() => {
            if (!started || isPaused || currentStep >= steps.length) return;

            const timer = setInterval(() => {
              setTimeLeft(prev => {
                if (prev <= 1) {
                  if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
                  handleNext();
                  return 0;
                }
                return prev - 1;
              });
            }, 1000);

            return () => clearInterval(timer);
          }, [started, isPaused, currentStep]);

          // 배경음악 재생/정지 제어 로직
          useEffect(() => {
            if (!audioRef.current) return;

            if (started && !isPaused && currentStep < steps.length) {
              audioRef.current.play().catch(e => console.error("음악 재생 실패:", e));
            } else {
              audioRef.current.pause();
            }
          }, [started, isPaused, currentStep]);

          const handleNext = () => {
            if (currentStep < steps.length) {
              const nextStep = currentStep + 1;
              setCurrentStep(nextStep);
              if (nextStep < steps.length) {
                setTimeLeft(steps[nextStep].time);
              }
            }
          };

          const handlePrev = () => {
            if (currentStep > 0) {
              const prevStep = currentStep - 1;
              setCurrentStep(prevStep);
              setTimeLeft(steps[prevStep].time);
            }
          };

          const handleRestart = () => {
            setStarted(false);
            setCurrentStep(0);
            setTimeLeft(steps[0].time);
            setIsPaused(false);
            if(audioRef.current) {
               audioRef.current.currentTime = 0;
            }
          };

          const toggleFullscreen = () => {
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen().catch(err => console.log(err));
            } else {
              if (document.exitFullscreen) document.exitFullscreen();
            }
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
          };

          const currentBgColor = currentStep < steps.length ? bgColors[currentStep % bgColors.length] : 'bg-green-100';

          return (
            <div className={`min-h-screen flex flex-col items-center justify-center transition-colors duration-1000 ${currentBgColor} p-4 relative`}>
              <button 
                onClick={toggleFullscreen}
                className="absolute top-4 right-4 p-3 bg-white/50 hover:bg-white/80 rounded-full shadow-sm transition-all z-50"
                title="전체화면"
              >
                {isFullscreen ? <Minimize className="w-6 h-6 text-gray-700" /> : <Maximize className="w-6 h-6 text-gray-700" />}
              </button>

              <audio ref={audioRef} src={audioSrc} loop />

              {!started && (
                <div className="bg-white/90 backdrop-blur-md rounded-[3rem] p-12 shadow-2xl text-center max-w-2xl w-full border-4 border-white">
                  <div className="flex justify-center mb-6">
                    <Star className="w-20 h-20 text-yellow-400 fill-yellow-400 animate-pulse" />
                  </div>
                  <h1 className="text-5xl md:text-6xl text-gray-800 mb-6 drop-shadow-sm">신나는 청소 시간!</h1>
                  <p className="text-2xl text-gray-600 mb-10">다 함께 교실을 반짝반짝하게 만들어봐요 ✨</p>
                  
                  <div className="mb-10 p-6 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-300">
                    <p className="text-xl text-gray-600 mb-4">🎵 우리 반만의 청소 음악이 있다면?</p>
                    <input 
                      type="file" 
                      accept="audio/*" 
                      onChange={handleFileUpload} 
                      ref={fileInputRef}
                      className="hidden"
                    />
                    
                    <button 
                      onClick={() => { if (fileInputRef.current) fileInputRef.current.click(); }}
                      className="flex items-center justify-center gap-2 mx-auto bg-white border-2 border-blue-400 text-blue-500 hover:bg-blue-50 py-2 px-6 rounded-full text-lg transition mb-4"
                    >
                      <Music className="w-6 h-6" />
                      {hasSavedMusic ? "다른 음악으로 변경하기" : "음악 파일(MP3) 선택하기"}
                    </button>

                    {hasSavedMusic ? (
                      <div className="flex flex-col items-center gap-2 mt-2">
                        <p className="text-green-500 font-bold text-lg bg-green-50 px-4 py-1 rounded-full">
                          ✅ 현재 음악: {musicName}
                        </p>
                        <button 
                          onClick={handleResetMusic} 
                          className="text-sm text-gray-400 underline hover:text-gray-600 mt-1"
                        >
                          초기화 (기본 bgm.mp3 사용)
                        </button>
                      </div>
                    ) : (
                      <p className="text-gray-400 text-sm mt-2">선택하지 않으면 선생님 폴더의 bgm.mp3가 재생됩니다.</p>
                    )}
                  </div>

                  <button 
                    onClick={() => setStarted(true)}
                    className="bg-blue-400 hover:bg-blue-500 text-white text-3xl py-5 px-12 rounded-full shadow-lg transform transition hover:scale-105 hover:-translate-y-1 w-full"
                  >
                    청소 시작하기 🚀
                  </button>
                </div>
              )}

              {started && currentStep < steps.length && (
                <div className="bg-white/90 backdrop-blur-md rounded-[3rem] p-8 md:p-12 shadow-2xl text-center max-w-3xl w-full border-4 border-white relative overflow-hidden">
                  <div className="absolute top-0 left-0 h-3 bg-gray-100 w-full">
                    <div 
                      className="h-full bg-blue-400 transition-all duration-1000"
                      style={{ width: `${((currentStep + 1) / steps.length) * 100}%` }}
                    ></div>
                  </div>

                  <div className="mt-4 mb-4">
                    <span className="bg-white text-blue-500 px-6 py-2 rounded-full text-2xl font-bold shadow-sm border-2 border-blue-100">
                      {currentStep + 1} / {steps.length} 단계
                    </span>
                  </div>

                  <h2 className="text-4xl md:text-5xl text-gray-800 mt-8 mb-4 leading-tight">
                    {steps[currentStep].title}
                  </h2>
                  <div className="text-7xl mb-8 animate-bounce">
                    {steps[currentStep].emoji}
                  </div>

                  <div className="my-8 relative">
                    <div className="text-8xl md:text-9xl font-bold text-gray-700 drop-shadow-md tracking-wider">
                      {formatTime(timeLeft)}
                    </div>
                    <div className="w-full bg-gray-100 h-4 rounded-full mt-8 overflow-hidden">
                      <div 
                        className="h-full bg-pink-400 transition-all duration-1000 rounded-full"
                        style={{ width: `${(timeLeft / steps[currentStep].time) * 100}%` }}
                      ></div>
                    </div>
                  </div>

                  <div className="flex items-center justify-center gap-6 mt-10">
                    <button 
                      onClick={handlePrev}
                      disabled={currentStep === 0}
                      className={`p-4 rounded-full transition-transform hover:scale-110 shadow-md ${currentStep === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-gray-50'}`}
                    >
                      <SkipBack className="w-8 h-8 md:w-10 md:h-10" />
                    </button>

                    <button 
                      onClick={() => setIsPaused(!isPaused)}
                      className="bg-yellow-400 hover:bg-yellow-500 text-white p-6 rounded-full shadow-lg transition-transform hover:scale-110"
                    >
                      {isPaused ? <Play className="w-12 h-12 md:w-14 md:h-14 fill-white" /> : <Pause className="w-12 h-12 md:w-14 md:h-14 fill-white" />}
                    </button>

                    <button 
                      onClick={handleNext}
                      className="p-4 rounded-full bg-white text-gray-700 hover:bg-gray-50 shadow-md transition-transform hover:scale-110"
                    >
                      <SkipForward className="w-8 h-8 md:w-10 md:h-10" />
                    </button>
                  </div>
                </div>
              )}

              {started && currentStep >= steps.length && (
                <div className="bg-white/95 backdrop-blur-md rounded-[3rem] p-12 shadow-2xl text-center max-w-2xl w-full border-4 border-green-200 animate-fade-in-up">
                  <div className="flex justify-center mb-8">
                    <CheckCircle2 className="w-24 h-24 text-green-500" />
                  </div>
                  <h1 className="text-4xl md:text-5xl text-green-600 mb-8 leading-snug">
                    우리 반을 깨끗하게 해줘서<br/>고마워! 💖
                  </h1>
                  <p className="text-3xl text-gray-700 mb-12 bg-green-50 p-6 rounded-2xl">
                    점심 맛있게 먹고<br/>5교시 수업을 준비해주세요! 🍱
                  </p>
                  <button 
                    onClick={handleRestart}
                    className="flex items-center justify-center gap-3 bg-gray-800 hover:bg-gray-900 text-white text-2xl py-4 px-10 rounded-full mx-auto shadow-xl transition transform hover:scale-105"
                  >
                    <RefreshCw className="w-7 h-7" />
                    처음부터 다시 하기
                  </button>
                </div>
              )}
            </div>
          );
        }

        // React 앱을 화면에 그리기
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

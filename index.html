<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>청소 시간 타이머</title>
    
    <!-- React, ReactDOM, Babel 라이브러리 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- localForage (데이터 저장용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 폰트 스타일 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; margin: 0; padding: 0; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        
        /* 유튜브 플레이어 숨김 - 유튜브 정책상 크기가 0이거나 display:none이면 재생을 막으므로 
           크기를 할당한 뒤 화면 밖으로 멀리 보내버립니다. */
        #youtube-player-container { 
            position: absolute; 
            top: -9999px; 
            left: -9999px; 
            width: 300px; 
            height: 300px; 
            opacity: 0.01;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG 아이콘
        const Play = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M8 5v14l11-7z"/></svg>;
        const Pause = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>;
        const SkipForward = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>;
        const SkipBack = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>;
        const RefreshCw = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const CheckCircle2 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>;
        const Star = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const Maximize = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>;
        const Minimize = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>;
        const Music = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>;
        const YoutubeIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M21.582 6.186a2.618 2.618 0 0 0-1.841-1.854C18.118 3.9 12 3.9 12 3.9s-6.118 0-7.741.432a2.618 2.618 0 0 0-1.841 1.854C2 7.828 2 12 2 12s0 4.172.418 5.814a2.618 2.618 0 0 0 1.841 1.854C5.882 20.1 12 20.1 12 20.1s6.118 0 7.741-.432a2.618 2.618 0 0 0 1.841-1.854C22 16.172 22 12 22 12s0-4.172-.418-5.814zM9.99 15.45V8.55L15.993 12 9.99 15.45z"/></svg>;

        const steps = [
          { title: "책상 위, 서랍 정리하기", time: 50, emoji: "📚✨" },
          { title: "책상 살짝 밀고, 창문 열기", time: 50, emoji: "☀️💨" },
          { title: "청소 도구 챙겨오기", time: 30, emoji: "🏃💨" },
          { title: "책상 아래, 교실 꼼꼼히 쓸기", time: 180, emoji: "♻️✨" },
          { title: "책상 맞추고 청소 도구 정리하기", time: 120, emoji: "🎒📦" },
          { title: "손 씻고 급식 줄서기", time: 180, emoji: "💦🍱" }
        ];

        const bgColors = ['bg-pink-100', 'bg-orange-100', 'bg-yellow-100', 'bg-green-100', 'bg-blue-100', 'bg-purple-100'];

        // 유튜브 URL에서 ID 추출 정규식 (shorts 포함)
        function extractYouTubeId(url) {
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function App() {
          const [started, setStarted] = useState(false);
          const [currentStep, setCurrentStep] = useState(0);
          const [timeLeft, setTimeLeft] = useState(steps[0].time);
          const [isPaused, setIsPaused] = useState(false);
          const [isFullscreen, setIsFullscreen] = useState(false);
          
          // 음악 관련 상태 ('file', 'youtube', 'default')
          const [musicMode, setMusicMode] = useState('default');
          const [audioSrc, setAudioSrc] = useState("bgm.mp3");
          const [musicName, setMusicName] = useState("");
          const [youtubeUrlInput, setYoutubeUrlInput] = useState("");
          const [youtubeId, setYoutubeId] = useState("");
          const [ytApiReady, setYtApiReady] = useState(false);
          
          const audioRef = useRef(null);
          const wakeLockRef = useRef(null);
          const fileInputRef = useRef(null);
          const ytPlayerRef = useRef(null);
          
          // 콜백 함수에서 최신 상태를 참조하기 위한 Ref
          const playbackStateRef = useRef({ started: false, isPaused: false, currentStep: 0 });

          // 상태가 변할 때마다 Ref 업데이트
          useEffect(() => {
            playbackStateRef.current = { started, isPaused, currentStep };
          }, [started, isPaused, currentStep]);

          // 1. 초기 로딩 시: 저장된 음악 설정 불러오기 및 유튜브 API 로드
          useEffect(() => {
            localforage.getItem('savedBgmData').then((savedData) => {
              if (savedData) {
                if (savedData.type === 'file' && savedData.blob) {
                  const fileUrl = URL.createObjectURL(savedData.blob);
                  setAudioSrc(fileUrl);
                  setMusicMode('file');
                  setMusicName(savedData.name || "나만의 음악");
                } else if (savedData.type === 'youtube' && savedData.id) {
                  setYoutubeId(savedData.id);
                  setMusicMode('youtube');
                  setMusicName("유튜브 배경음악");
                }
              }
            }).catch(err => console.error("음악 불러오기 실패:", err));

            if (!window.YT) {
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                window.onYouTubeIframeAPIReady = () => {
                    setYtApiReady(true);
                };
            } else {
                setYtApiReady(true);
            }
          }, []);

          // 음악 초기화 함수 (에러 발생 시 접근 위해 상단 배치)
          const handleResetMusic = () => {
            localforage.removeItem('savedBgmData').then(() => {
              setAudioSrc("bgm.mp3");
              setMusicMode('default');
              setMusicName("");
              setYoutubeId("");
              if (ytPlayerRef.current && typeof ytPlayerRef.current.pauseVideo === 'function') {
                  ytPlayerRef.current.pauseVideo();
              }
            });
          };

          // 2. 유튜브 플레이어 초기화 (API가 준비되었고, 유튜브 ID가 있을 때)
          useEffect(() => {
            if (musicMode === 'youtube' && ytApiReady && youtubeId) {
                if (ytPlayerRef.current && typeof ytPlayerRef.current.loadVideoById === 'function') {
                    ytPlayerRef.current.loadVideoById(youtubeId);
                } else {
                    ytPlayerRef.current = new window.YT.Player('youtube-player', {
                        height: '300',
                        width: '300',
                        videoId: youtubeId,
                        playerVars: {
                            'autoplay': 0, 
                            'controls': 0, 
                            'loop': 1, 
                            'playlist': youtubeId,
                            'origin': window.location.origin
                        },
                        events: {
                            'onStateChange': (event) => {
                                const { started: currStarted, isPaused: currPaused, currentStep: currStep } = playbackStateRef.current;
                                // event.data === 0 (동영상 종료)
                                if (event.data === 0 && currStarted && !currPaused && currStep < steps.length) {
                                    event.target.seekTo(0);
                                    event.target.playVideo();
                                }
                            },
                            'onError': (event) => {
                                // 101, 150 코드는 저작권자가 타 사이트에서의 임베드(재생)를 막은 영상입니다.
                                if (event.data === 150 || event.data === 101) {
                                    alert("이 영상은 저작권 정책으로 인해 외부에서 재생할 수 없습니다. 다른 유튜브 곡이나 MP3를 선택해주세요!");
                                    handleResetMusic();
                                }
                            }
                        }
                    });
                }
            }
          }, [musicMode, ytApiReady, youtubeId]);

          // MP3 파일 업로드
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              localforage.setItem('savedBgmData', { type: 'file', blob: file, name: file.name }).then(() => {
                const fileUrl = URL.createObjectURL(file);
                setAudioSrc(fileUrl);
                setMusicMode('file');
                setMusicName(file.name);
                if (ytPlayerRef.current && typeof ytPlayerRef.current.pauseVideo === 'function') ytPlayerRef.current.pauseVideo();
              });
            }
          };

          // 유튜브 링크 등록
          const handleYoutubeSubmit = () => {
            const extractedId = extractYouTubeId(youtubeUrlInput);
            if (extractedId) {
                localforage.setItem('savedBgmData', { type: 'youtube', id: extractedId }).then(() => {
                    setYoutubeId(extractedId);
                    setMusicMode('youtube');
                    setMusicName("유튜브 배경음악");
                    setYoutubeUrlInput("");
                    if (audioRef.current) audioRef.current.pause();
                });
            } else {
                alert("올바른 유튜브 영상 링크를 입력해주세요.");
            }
          };

          // 화면 꺼짐 방지
          useEffect(() => {
            const requestWakeLock = async () => {
              if ('wakeLock' in navigator) wakeLockRef.current = await navigator.wakeLock.request('screen');
            };
            const releaseWakeLock = async () => {
              if (wakeLockRef.current) { await wakeLockRef.current.release(); wakeLockRef.current = null; }
            };
            if (started && !isPaused) requestWakeLock(); else releaseWakeLock();
            return () => { releaseWakeLock(); };
          }, [started, isPaused]);

          // 타이머 & 전체화면 로직
          useEffect(() => {
            const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
          }, []);

          useEffect(() => {
            if (!started || isPaused || currentStep >= steps.length) return;
            const timer = setInterval(() => {
              setTimeLeft(prev => {
                if (prev <= 1) {
                  if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
                  handleNext();
                  return 0;
                }
                return prev - 1;
              });
            }, 1000);
            return () => clearInterval(timer);
          }, [started, isPaused, currentStep]);

          // === 음악 재생/정지 동기화 (끊김 방지 최적화) ===
          useEffect(() => {
            const isPlayingCondition = started && !isPaused && currentStep < steps.length;
            
            // MP3 파일인 경우
            if (musicMode === 'default' || musicMode === 'file') {
                if (audioRef.current) {
                    if (isPlayingCondition) {
                        // 이미 재생 중이 아닐 때만 재생 명령
                        if (audioRef.current.paused) audioRef.current.play().catch(() => {});
                    } else {
                        // 이미 정지 중이 아닐 때만 정지 명령
                        if (!audioRef.current.paused) audioRef.current.pause();
                    }
                }
            } 
            // 유튜브인 경우
            else if (musicMode === 'youtube' && ytPlayerRef.current && typeof ytPlayerRef.current.getPlayerState === 'function') {
                try {
                    const state = ytPlayerRef.current.getPlayerState();
                    if (isPlayingCondition) {
                        // 0: 끝남, 1: 재생중, 2: 일시중지, 3: 버퍼링, 5: 동영상 신호
                        if (state === 0) ytPlayerRef.current.seekTo(0);
                        if (state !== 1 && state !== 3) ytPlayerRef.current.playVideo();
                    } else {
                        if (state === 1 || state === 3) ytPlayerRef.current.pauseVideo();
                    }
                } catch (e) {
                    console.error("유튜브 재생 동기화 오류:", e);
                }
            }
          }, [started, isPaused, currentStep, musicMode]);

          // 컨트롤 핸들러
          const handleNext = () => {
            if (currentStep < steps.length) {
              const nextStep = currentStep + 1;
              setCurrentStep(nextStep);
              if (nextStep < steps.length) setTimeLeft(steps[nextStep].time);
            }
          };
          const handlePrev = () => {
            if (currentStep > 0) {
              const prevStep = currentStep - 1;
              setCurrentStep(prevStep);
              setTimeLeft(steps[prevStep].time);
            }
          };
          const handleRestart = () => {
            setStarted(false);
            setCurrentStep(0);
            setTimeLeft(steps[0].time);
            setIsPaused(false);
            if(audioRef.current) audioRef.current.currentTime = 0;
            if (ytPlayerRef.current && typeof ytPlayerRef.current.seekTo === 'function') ytPlayerRef.current.seekTo(0);
          };

          const toggleFullscreen = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else if (document.exitFullscreen) document.exitFullscreen();
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
          };

          const currentBgColor = currentStep < steps.length ? bgColors[currentStep % bgColors.length] : 'bg-green-100';

          return (
            <div className={`min-h-screen flex flex-col items-center justify-center transition-colors duration-1000 ${currentBgColor} p-4 relative`}>
              <button onClick={toggleFullscreen} className="absolute top-4 right-4 p-3 bg-white/50 hover:bg-white/80 rounded-full shadow-sm transition-all z-50">
                {isFullscreen ? <Minimize className="w-6 h-6 text-gray-700" /> : <Maximize className="w-6 h-6 text-gray-700" />}
              </button>

              {/* 보이지 않는 오디오 / 유튜브 플레이어 */}
              <audio ref={audioRef} src={audioSrc} loop />
              <div id="youtube-player-container"><div id="youtube-player"></div></div>

              {!started && (
                <div className="bg-white/90 backdrop-blur-md rounded-[3rem] p-8 md:p-12 shadow-2xl text-center max-w-2xl w-full border-4 border-white mt-10 md:mt-0">
                  <div className="flex justify-center mb-6">
                    <Star className="w-20 h-20 text-yellow-400 fill-yellow-400 animate-pulse" />
                  </div>
                  <h1 className="text-5xl md:text-6xl text-gray-800 mb-4 drop-shadow-sm">신나는 청소 시간!</h1>
                  <p className="text-xl text-gray-600 mb-8">다 함께 교실을 반짝반짝하게 만들어봐요 ✨</p>
                  
                  {/* 음악 설정 패널 */}
                  <div className="mb-10 p-6 bg-gray-50 rounded-3xl border border-gray-200 shadow-inner text-left">
                    <p className="text-xl text-gray-700 mb-4 text-center">🎵 우리 반 청소 음악 설정</p>
                    
                    <div className="flex flex-col gap-4">
                        {/* 유튜브 링크 입력 */}
                        <div className="flex gap-2">
                            <input 
                                type="text" 
                                placeholder="유튜브 영상 또는 뮤직 링크 붙여넣기" 
                                value={youtubeUrlInput}
                                onChange={(e) => setYoutubeUrlInput(e.target.value)}
                                className="flex-1 px-4 py-2 rounded-xl border-2 border-gray-300 focus:border-red-400 outline-none font-sans text-sm"
                            />
                            <button 
                                onClick={handleYoutubeSubmit}
                                className="bg-red-500 hover:bg-red-600 text-white px-4 rounded-xl flex items-center gap-1 transition shadow-sm whitespace-nowrap"
                            >
                                <YoutubeIcon className="w-5 h-5" /> 유튜브 적용
                            </button>
                        </div>

                        <div className="flex items-center gap-4">
                            <div className="h-px bg-gray-300 flex-1"></div>
                            <span className="text-gray-400 text-sm">또는</span>
                            <div className="h-px bg-gray-300 flex-1"></div>
                        </div>

                        {/* MP3 파일 업로드 */}
                        <input type="file" accept="audio/*" onChange={handleFileUpload} ref={fileInputRef} className="hidden" />
                        <button 
                            onClick={() => { if (fileInputRef.current) fileInputRef.current.click(); }}
                            className="flex items-center justify-center gap-2 w-full bg-white border-2 border-blue-400 text-blue-500 hover:bg-blue-50 py-2 px-6 rounded-xl transition"
                        >
                            <Music className="w-5 h-5" /> MP3 파일(내 컴퓨터) 선택하기
                        </button>
                    </div>

                    {/* 현재 음악 상태 표시 */}
                    <div className="mt-6 text-center">
                        {musicMode !== 'default' ? (
                          <div className="flex flex-col items-center gap-1">
                            <p className="text-green-600 font-bold text-lg bg-green-100 px-4 py-1.5 rounded-full inline-flex items-center gap-2">
                                {musicMode === 'youtube' ? <YoutubeIcon className="w-5 h-5 text-red-500"/> : <Music className="w-5 h-5"/>}
                                현재 음악: {musicName}
                            </p>
                            <button onClick={handleResetMusic} className="text-sm text-gray-500 underline hover:text-gray-700 mt-2">
                              초기화 (선생님 기본 배경음 사용)
                            </button>
                          </div>
                        ) : (
                          <p className="text-gray-400 text-sm">설정하지 않으면 선생님의 기본 배경음이 재생됩니다.</p>
                        )}
                    </div>
                  </div>

                  <button onClick={() => setStarted(true)} className="bg-blue-400 hover:bg-blue-500 text-white text-3xl py-5 px-12 rounded-full shadow-lg transform transition hover:scale-105 hover:-translate-y-1 w-full">
                    청소 시작하기 🚀
                  </button>
                </div>
              )}

              {/* 진행 화면 */}
              {started && currentStep < steps.length && (
                <div className="bg-white/90 backdrop-blur-md rounded-[3rem] p-8 md:p-12 shadow-2xl text-center max-w-3xl w-full border-4 border-white relative overflow-hidden">
                  <div className="absolute top-0 left-0 h-3 bg-gray-100 w-full">
                    <div className="h-full bg-blue-400 transition-all duration-1000" style={{ width: `${((currentStep + 1) / steps.length) * 100}%` }}></div>
                  </div>
                  <div className="mt-4 mb-4">
                    <span className="bg-white text-blue-500 px-6 py-2 rounded-full text-2xl font-bold shadow-sm border-2 border-blue-100">{currentStep + 1} / {steps.length} 단계</span>
                  </div>
                  <h2 className="text-4xl md:text-5xl text-gray-800 mt-8 mb-4 leading-tight">{steps[currentStep].title}</h2>
                  <div className="text-7xl mb-8 animate-bounce">{steps[currentStep].emoji}</div>
                  <div className="my-8 relative">
                    <div className="text-8xl md:text-9xl font-bold text-gray-700 drop-shadow-md tracking-wider">{formatTime(timeLeft)}</div>
                    <div className="w-full bg-gray-100 h-4 rounded-full mt-8 overflow-hidden">
                      <div className="h-full bg-pink-400 transition-all duration-1000 rounded-full" style={{ width: `${(timeLeft / steps[currentStep].time) * 100}%` }}></div>
                    </div>
                  </div>
                  <div className="flex items-center justify-center gap-6 mt-10">
                    <button onClick={handlePrev} disabled={currentStep === 0} className={`p-4 rounded-full transition-transform hover:scale-110 shadow-md ${currentStep === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-gray-50'}`}>
                      <SkipBack className="w-8 h-8 md:w-10 md:h-10" />
                    </button>
                    <button onClick={() => setIsPaused(!isPaused)} className="bg-yellow-400 hover:bg-yellow-500 text-white p-6 rounded-full shadow-lg transition-transform hover:scale-110">
                      {isPaused ? <Play className="w-12 h-12 md:w-14 md:h-14 fill-white" /> : <Pause className="w-12 h-12 md:w-14 md:h-14 fill-white" />}
                    </button>
                    <button onClick={handleNext} className="p-4 rounded-full bg-white text-gray-700 hover:bg-gray-50 shadow-md transition-transform hover:scale-110">
                      <SkipForward className="w-8 h-8 md:w-10 md:h-10" />
                    </button>
                  </div>
                </div>
              )}

              {/* 완료 화면 */}
              {started && currentStep >= steps.length && (
                <div className="bg-white/95 backdrop-blur-md rounded-[3rem] p-12 shadow-2xl text-center max-w-2xl w-full border-4 border-green-200 animate-fade-in-up">
                  <div className="flex justify-center mb-8"><CheckCircle2 className="w-24 h-24 text-green-500" /></div>
                  <h1 className="text-4xl md:text-5xl text-green-600 mb-8 leading-snug">우리 반을 깨끗하게 해줘서<br/>고마워! 💖</h1>
                  <p className="text-3xl text-gray-700 mb-12 bg-green-50 p-6 rounded-2xl">점심 맛있게 먹고<br/>5교시 수업을 준비해주세요! 🍱</p>
                  <button onClick={handleRestart} className="flex items-center justify-center gap-3 bg-gray-800 hover:bg-gray-900 text-white text-2xl py-4 px-10 rounded-full mx-auto shadow-xl transition transform hover:scale-105">
                    <RefreshCw className="w-7 h-7" /> 처음부터 다시 하기
                  </button>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

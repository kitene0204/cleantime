<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>청소 시간 타이머</title>
    
    <!-- React, ReactDOM, Babel 라이브러리 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- localForage (데이터 저장용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 폰트 스타일 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        body { font-family: 'Jua', sans-serif; margin: 0; padding: 0; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        
        /* 유튜브 플레이어 숨김 - 유튜브 정책상 크기가 0이거나 display:none이면 재생을 막으므로 
           크기를 할당한 뒤 화면 밖으로 멀리 보내버립니다. */
        #youtube-player-container { 
            position: absolute; 
            top: -9999px; 
            left: -9999px; 
            width: 300px; 
            height: 300px; 
            opacity: 0.01;
            overflow: hidden;
        }

        /* 청소 구역 이미지 스크롤바 숨김 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG 아이콘 모음
        const Play = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M8 5v14l11-7z"/></svg>;
        const Pause = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>;
        const SkipForward = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>;
        const SkipBack = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>;
        const RefreshCw = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>;
        const CheckCircle2 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>;
        const Star = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const Maximize = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>;
        const Minimize = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>;
        const Music = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>;
        const YoutubeIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M21.582 6.186a2.618 2.618 0 0 0-1.841-1.854C18.118 3.9 12 3.9 12 3.9s-6.118 0-7.741.432a2.618 2.618 0 0 0-1.841 1.854C2 7.828 2 12 2 12s0 4.172.418 5.814a2.618 2.618 0 0 0 1.841 1.854C5.882 20.1 12 20.1 12 20.1s6.118 0 7.741-.432a2.618 2.618 0 0 0 1.841-1.854C22 16.172 22 12 22 12s0-4.172-.418-5.814zM9.99 15.45V8.55L15.993 12 9.99 15.45z"/></svg>;
        const SearchIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
        const HomeIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const ImageIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
        const TrashIcon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        
        // 볼륨 아이콘
        const VolumeX = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>;
        const Volume1 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>;
        const Volume2 = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>;

        const steps = [
          { title: "책상 위, 서랍 정리하기", time: 50, emoji: "📚✨" },
          { title: "책상 살짝 밀고, 창문 열기", time: 50, emoji: "☀️💨" },
          { title: "청소 도구 챙겨오기", time: 30, emoji: "🏃💨" },
          { title: "책상 아래, 교실 꼼꼼히 쓸기", time: 180, emoji: "♻️✨" },
          { title: "책상 맞추고 청소 도구 정리하기", time: 120, emoji: "🎒📦" },
          { title: "손 씻고 급식 줄서기", time: 180, emoji: "💦🍱" }
        ];

        const bgColors = ['bg-pink-100', 'bg-orange-100', 'bg-yellow-100', 'bg-green-100', 'bg-blue-100', 'bg-purple-100'];

        // 유튜브 URL에서 ID 추출 정규식
        function extractYouTubeId(url) {
            const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=|shorts\/)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function App() {
          const [started, setStarted] = useState(false);
          const [currentStep, setCurrentStep] = useState(0);
          const [timeLeft, setTimeLeft] = useState(steps[0].time);
          const [isPaused, setIsPaused] = useState(false);
          const [isFullscreen, setIsFullscreen] = useState(false);
          const [userInteracted, setUserInteracted] = useState(false);
          
          // 실시간 날짜/시간 상태
          const [currentTime, setCurrentTime] = useState(new Date());

          // 음악 관련 상태
          const [musicMode, setMusicMode] = useState('default');
          const [audioSrc, setAudioSrc] = useState("bgm.mp3");
          const [musicName, setMusicName] = useState("");
          const [youtubeSearchInput, setYoutubeSearchInput] = useState("");
          const [youtubeId, setYoutubeId] = useState("");
          const [ytApiReady, setYtApiReady] = useState(false);
          const [showSearchGuide, setShowSearchGuide] = useState(false);
          
          // 볼륨 조절 및 음소거 상태 추가
          const [volume, setVolume] = useState(50); // 0 ~ 100
          const [isMuted, setIsMuted] = useState(false);
          
          // 청소 구역 이미지 상태
          const [cleaningImg, setCleaningImg] = useState(null);
          
          const audioRef = useRef(null);
          const wakeLockRef = useRef(null);
          const fileInputRef = useRef(null);
          const imgInputRef = useRef(null);
          const ytPlayerRef = useRef(null);
          
          const playbackStateRef = useRef({ started: false, isPaused: false, currentStep: 0, userInteracted: false });

          useEffect(() => {
            playbackStateRef.current = { started, isPaused, currentStep, userInteracted };
          }, [started, isPaused, currentStep, userInteracted]);

          // 현재 시각 업데이트 (1초마다)
          useEffect(() => {
            const clockTimer = setInterval(() => setCurrentTime(new Date()), 1000);
            return () => clearInterval(clockTimer);
          }, []);

          // 화면 클릭 감지 (자동 재생 권한 획득용)
          useEffect(() => {
            const handleInteraction = () => {
                setUserInteracted(true);
                window.removeEventListener('click', handleInteraction);
                window.removeEventListener('touchstart', handleInteraction);
            };
            window.addEventListener('click', handleInteraction);
            window.addEventListener('touchstart', handleInteraction);

            return () => {
                window.removeEventListener('click', handleInteraction);
                window.removeEventListener('touchstart', handleInteraction);
            };
          }, []);

          // 12시 정각 자동 시작 로직
          useEffect(() => {
            const checkTimeInterval = setInterval(() => {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();

                if (hours === 12 && minutes === 0 && seconds === 0 && !playbackStateRef.current.started) {
                    if (playbackStateRef.current.userInteracted) {
                        setStarted(true);
                    } else {
                        alert("낮 12시가 되었습니다!\n화면을 한 번 클릭해야 청소 음악이 자동 시작됩니다.");
                    }
                }
            }, 1000);
            return () => clearInterval(checkTimeInterval);
          }, []);

          // 1. 초기 로딩 시: 저장된 데이터 불러오기
          useEffect(() => {
            // 음악 불러오기
            localforage.getItem('savedBgmData').then((savedData) => {
              if (savedData) {
                if (savedData.type === 'file' && savedData.blob) {
                  const fileUrl = URL.createObjectURL(savedData.blob);
                  setAudioSrc(fileUrl);
                  setMusicMode('file');
                  setMusicName(savedData.name || "나만의 음악");
                } else if (savedData.type === 'youtube' && savedData.id) {
                  setYoutubeId(savedData.id);
                  setMusicMode('youtube');
                  setMusicName(savedData.title || "유튜브 배경음악");
                }
              }
            }).catch(err => console.error("음악 불러오기 실패:", err));

            // 볼륨 불러오기
            localforage.getItem('savedVolume').then((val) => {
              if (val !== null) setVolume(val);
            });
            localforage.getItem('savedMuted').then((val) => {
              if (val !== null) setIsMuted(val);
            });

            // 청소구역 이미지 불러오기
            localforage.getItem('savedCleaningImg').then((blob) => {
              if (blob) {
                setCleaningImg(URL.createObjectURL(blob));
              }
            }).catch(err => console.error("청소 이미지 불러오기 실패:", err));

            // 유튜브 API 세팅
            if (!window.YT) {
                const tag = document.createElement('script');
                tag.src = "https://www.youtube.com/iframe_api";
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                window.onYouTubeIframeAPIReady = () => {
                    setYtApiReady(true);
                };
            } else {
                setYtApiReady(true);
            }
          }, []);

          // 음악 초기화 함수
          const handleResetMusic = () => {
            localforage.removeItem('savedBgmData').then(() => {
              setAudioSrc("bgm.mp3");
              setMusicMode('default');
              setMusicName("");
              setYoutubeId("");
              if (ytPlayerRef.current && typeof ytPlayerRef.current.pauseVideo === 'function') {
                  ytPlayerRef.current.pauseVideo();
              }
            });
          };

          // 볼륨 제어 로직 (볼륨 조절 시 오디오와 유튜브 동시에 적용)
          useEffect(() => {
              if (audioRef.current) {
                  audioRef.current.volume = volume / 100;
                  audioRef.current.muted = isMuted;
              }
              if (ytPlayerRef.current && typeof ytPlayerRef.current.setVolume === 'function') {
                  try {
                      ytPlayerRef.current.setVolume(volume);
                      if (isMuted) ytPlayerRef.current.mute();
                      else ytPlayerRef.current.unMute();
                  } catch (e) {}
              }
              
              localforage.setItem('savedVolume', volume);
              localforage.setItem('savedMuted', isMuted);
          }, [volume, isMuted, musicMode]);

          const handleVolumeChange = (e) => {
              const val = Number(e.target.value);
              setVolume(val);
              if (isMuted && val > 0) setIsMuted(false);
          };

          // 2. 유튜브 플레이어 초기화
          useEffect(() => {
            if (musicMode === 'youtube' && ytApiReady && youtubeId) {
                if (ytPlayerRef.current && typeof ytPlayerRef.current.loadVideoById === 'function') {
                    ytPlayerRef.current.loadVideoById(youtubeId);
                } else {
                    ytPlayerRef.current = new window.YT.Player('youtube-player', {
                        height: '300',
                        width: '300',
                        videoId: youtubeId,
                        playerVars: {
                            'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': youtubeId, 'origin': window.location.origin
                        },
                        events: {
                            'onReady': (event) => {
                                event.target.setVolume(volume);
                                if (isMuted) event.target.mute();
                            },
                            'onStateChange': (event) => {
                                const { started: currStarted, isPaused: currPaused, currentStep: currStep } = playbackStateRef.current;
                                if (event.data === 0 && currStarted && !currPaused && currStep < steps.length) {
                                    event.target.seekTo(0);
                                    event.target.playVideo();
                                }
                            },
                            'onError': (event) => {
                                if (event.data === 150 || event.data === 101) {
                                    alert("이 영상은 저작권 정책으로 인해 외부에서 재생할 수 없습니다. 검색을 통해 다른 곡을 찾아주세요!");
                                    handleResetMusic();
                                }
                            }
                        }
                    });
                }
            }
          }, [musicMode, ytApiReady, youtubeId]);

          // MP3 파일 업로드
          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              localforage.setItem('savedBgmData', { type: 'file', blob: file, name: file.name }).then(() => {
                const fileUrl = URL.createObjectURL(file);
                setAudioSrc(fileUrl);
                setMusicMode('file');
                setMusicName(file.name);
                if (ytPlayerRef.current && typeof ytPlayerRef.current.pauseVideo === 'function') ytPlayerRef.current.pauseVideo();
              });
            }
          };

          // 청소 구역 이미지 업로드 핸들러
          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              localforage.setItem('savedCleaningImg', file).then(() => {
                const fileUrl = URL.createObjectURL(file);
                setCleaningImg(fileUrl);
              });
            }
          };

          // 청소 구역 이미지 초기화(삭제) 핸들러
          const handleResetImage = () => {
            localforage.removeItem('savedCleaningImg').then(() => {
                setCleaningImg(null);
                if (imgInputRef.current) imgInputRef.current.value = "";
            });
          };

          // 선택한 유튜브 곡 적용 함수
          const applyYoutubeMusic = (id, title) => {
            localforage.setItem('savedBgmData', { type: 'youtube', id: id, title: title }).then(() => {
                setYoutubeId(id);
                setMusicMode('youtube');
                setMusicName(title);
                setYoutubeSearchInput("");
                setShowSearchGuide(false);
                if (audioRef.current) audioRef.current.pause();
            });
          };

          // 유튜브 에러 없는 안전한 새 창 검색
          const handleYoutubeSubmit = () => {
            if (!youtubeSearchInput.trim()) return;
            const extractedId = extractYouTubeId(youtubeSearchInput);
            if (extractedId) {
                applyYoutubeMusic(extractedId, "선택한 유튜브 배경음악");
            } else {
                window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(youtubeSearchInput)}`, '_blank');
                setShowSearchGuide(true);
            }
          };

          // 화면 꺼짐 방지
          useEffect(() => {
            const requestWakeLock = async () => {
              if ('wakeLock' in navigator) wakeLockRef.current = await navigator.wakeLock.request('screen');
            };
            const releaseWakeLock = async () => {
              if (wakeLockRef.current) { await wakeLockRef.current.release(); wakeLockRef.current = null; }
            };
            if (started && !isPaused) requestWakeLock(); else releaseWakeLock();
            return () => { releaseWakeLock(); };
          }, [started, isPaused]);

          // 타이머 & 전체화면 로직
          useEffect(() => {
            const handleFullscreenChange = () => setIsFullscreen(!!document.fullscreenElement);
            document.addEventListener('fullscreenchange', handleFullscreenChange);
            return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
          }, []);

          useEffect(() => {
            if (!started || isPaused || currentStep >= steps.length) return;
            const timer = setInterval(() => {
              setTimeLeft(prev => {
                if (prev <= 1) {
                  if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
                  handleNext();
                  return 0;
                }
                return prev - 1;
              });
            }, 1000);
            return () => clearInterval(timer);
          }, [started, isPaused, currentStep]);

          // 음악 재생/정지 동기화
          useEffect(() => {
            const isPlayingCondition = started && !isPaused && currentStep < steps.length;
            if (musicMode === 'default' || musicMode === 'file') {
                if (audioRef.current) {
                    if (isPlayingCondition) {
                        if (audioRef.current.paused) audioRef.current.play().catch(() => {});
                    } else {
                        if (!audioRef.current.paused) audioRef.current.pause();
                    }
                }
            } 
            else if (musicMode === 'youtube' && ytPlayerRef.current && typeof ytPlayerRef.current.getPlayerState === 'function') {
                try {
                    const state = ytPlayerRef.current.getPlayerState();
                    if (isPlayingCondition) {
                        if (state === 0) ytPlayerRef.current.seekTo(0);
                        if (state !== 1 && state !== 3) ytPlayerRef.current.playVideo();
                    } else {
                        if (state === 1 || state === 3) ytPlayerRef.current.pauseVideo();
                    }
                } catch (e) {}
            }
          }, [started, isPaused, currentStep, musicMode]);

          const handleNext = () => {
            if (currentStep < steps.length) {
              const nextStep = currentStep + 1;
              setCurrentStep(nextStep);
              if (nextStep < steps.length) setTimeLeft(steps[nextStep].time);
            }
          };
          const handlePrev = () => {
            if (currentStep > 0) {
              const prevStep = currentStep - 1;
              setCurrentStep(prevStep);
              setTimeLeft(steps[prevStep].time);
            }
          };
          
          // 처음(홈)으로 되돌아가기
          const handleRestart = () => {
            setStarted(false);
            setCurrentStep(0);
            setTimeLeft(steps[0].time);
            setIsPaused(false);
            if(audioRef.current) audioRef.current.currentTime = 0;
            if (ytPlayerRef.current && typeof ytPlayerRef.current.seekTo === 'function') ytPlayerRef.current.seekTo(0);
          };

          const toggleFullscreen = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            else if (document.exitFullscreen) document.exitFullscreen();
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
          };

          // 시계 표시용 문자열 생성
          const daysOfWeek = ['일', '월', '화', '수', '목', '금', '토'];
          const dateStr = `${currentTime.getFullYear()}년 ${currentTime.getMonth() + 1}월 ${currentTime.getDate()}일 (${daysOfWeek[currentTime.getDay()]}요일)`;
          const timeStr = currentTime.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          const currentBgColor = currentStep < steps.length ? bgColors[currentStep % bgColors.length] : 'bg-green-100';

          return (
            <div className={`min-h-screen flex flex-col items-center justify-center transition-colors duration-1000 ${currentBgColor} p-4 relative`}>
              
              {/* 12시 자동 시작 안내 띠 */}
              {!started && !userInteracted && (
                <div className="fixed top-0 left-0 w-full bg-red-500 text-white text-center py-2 z-[100] text-sm md:text-base animate-pulse cursor-pointer shadow-md">
                    ⚠️ 12시 자동 시작을 위해 화면 아무 곳이나 한 번 클릭해주세요!
                </div>
              )}

              {/* 좌측 상단: 현재 시계 */}
              <div className="absolute top-4 left-4 md:top-6 md:left-6 bg-white/60 backdrop-blur-md px-4 py-2 rounded-2xl shadow-sm text-gray-700 text-center z-50">
                  <div className="text-xs md:text-sm text-gray-500">{dateStr}</div>
                  <div className="text-lg md:text-2xl font-bold">{timeStr}</div>
              </div>

              {/* 우측 상단: 컨트롤 버튼 영역 (볼륨 + 홈 + 전체화면) */}
              <div className="absolute top-4 right-4 md:top-6 md:right-6 flex items-center gap-2 md:gap-3 z-50">
                  
                  {/* 볼륨 조절 컨트롤 */}
                  <div className="flex items-center gap-1 md:gap-2 bg-white/60 backdrop-blur-md px-3 py-2 rounded-full shadow-sm transition-all group hover:bg-white/90">
                      <button onClick={() => setIsMuted(!isMuted)} className="p-1 text-gray-600 hover:text-blue-500 transition-colors" title="음소거">
                          {isMuted || volume === 0 ? <VolumeX className="w-5 h-5 md:w-6 md:h-6 text-red-500" /> : volume < 50 ? <Volume1 className="w-5 h-5 md:w-6 md:h-6" /> : <Volume2 className="w-5 h-5 md:w-6 md:h-6" />}
                      </button>
                      <input 
                          type="range" 
                          min="0" 
                          max="100" 
                          value={isMuted ? 0 : volume} 
                          onChange={handleVolumeChange}
                          className="w-16 md:w-24 h-1.5 bg-gray-300 rounded-lg appearance-none cursor-pointer accent-blue-500 opacity-70 group-hover:opacity-100 transition-opacity"
                          title="볼륨 조절"
                      />
                  </div>

                  {started && (
                      <button 
                          onClick={handleRestart} 
                          className="p-2 md:p-3 bg-white/60 hover:bg-white/90 rounded-full shadow-sm transition-all"
                          title="홈(처음)으로"
                      >
                          <HomeIcon className="w-5 h-5 md:w-6 md:h-6 text-gray-700" />
                      </button>
                  )}
                  <button 
                      onClick={toggleFullscreen} 
                      className="p-2 md:p-3 bg-white/60 hover:bg-white/90 rounded-full shadow-sm transition-all"
                      title="전체화면"
                  >
                      {isFullscreen ? <Minimize className="w-5 h-5 md:w-6 md:h-6 text-gray-700" /> : <Maximize className="w-5 h-5 md:w-6 md:h-6 text-gray-700" />}
                  </button>
              </div>

              {/* 보이지 않는 오디오 / 유튜브 플레이어 */}
              <audio ref={audioRef} src={audioSrc} loop />
              <div id="youtube-player-container"><div id="youtube-player"></div></div>

              {/* ======================= 시작(홈) 화면 ======================= */}
              {!started && (
                <div className="bg-white/90 backdrop-blur-md rounded-[3rem] p-8 md:p-12 shadow-2xl text-center max-w-4xl w-full border-4 border-white mt-24 md:mt-0 flex flex-col animate-fade-in-up">
                  <div className="flex justify-center mb-6">
                    <Star className="w-20 h-20 text-yellow-400 fill-yellow-400 animate-pulse" />
                  </div>
                  <h1 className="text-5xl md:text-6xl text-gray-800 mb-4 drop-shadow-sm">신나는 청소 시간!</h1>
                  <p className="text-xl text-gray-600 mb-10">다 함께 교실을 반짝반짝하게 만들어봐요 ✨</p>
                  
                  {/* 설정 패널 영역 (2단 그리드 분리) */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10 flex-1">
                      
                      {/* [패널 1] 음악 설정 */}
                      <div className="p-6 bg-gray-50 rounded-3xl border border-gray-200 shadow-inner text-left flex flex-col h-full">
                        <p className="text-xl text-gray-700 mb-4 text-center">🎵 우리 반 청소 음악 설정</p>
                        <div className="flex flex-col gap-4 flex-1">
                            <div className="flex flex-col gap-2 relative">
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="유튜브 주소 붙여넣기 또는 검색" 
                                        value={youtubeSearchInput}
                                        onChange={(e) => setYoutubeSearchInput(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleYoutubeSubmit()}
                                        className="flex-1 px-4 py-3 rounded-xl border-2 border-gray-300 focus:border-red-400 outline-none font-sans text-sm shadow-sm min-w-0"
                                    />
                                    <button 
                                        onClick={handleYoutubeSubmit}
                                        className="bg-red-500 hover:bg-red-600 text-white px-4 rounded-xl flex items-center gap-1 transition shadow-sm whitespace-nowrap"
                                    >
                                        <SearchIcon className="w-5 h-5" /> 검색
                                    </button>
                                </div>
                                
                                {showSearchGuide && (
                                    <div className="mt-2 p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-xs md:text-sm animate-fade-in-up flex flex-col gap-2">
                                        <p className="font-bold">✨ 새 창에 유튜브 결과가 열렸습니다!</p>
                                        <p>1. 열린 창에서 원하는 곡을 클릭하세요.</p>
                                        <p>2. 해당 영상의 <b>주소(URL)를 복사</b>하세요.</p>
                                        <p>3. 위 빈칸에 붙여넣고 <b>[검색]</b>을 누르세요.</p>
                                        <button onClick={() => setShowSearchGuide(false)} className="mt-1 self-end text-red-400 hover:text-red-600 underline">닫기</button>
                                    </div>
                                )}
                            </div>

                            <div className="flex items-center gap-4 my-1">
                                <div className="h-px bg-gray-300 flex-1"></div>
                                <span className="text-gray-400 text-sm">또는</span>
                                <div className="h-px bg-gray-300 flex-1"></div>
                            </div>

                            <input type="file" accept="audio/*" onChange={handleFileUpload} ref={fileInputRef} className="hidden" />
                            <button 
                                onClick={() => { if (fileInputRef.current) fileInputRef.current.click(); }}
                                className="flex items-center justify-center gap-2 w-full bg-white border-2 border-blue-400 text-blue-500 hover:bg-blue-50 py-3 px-6 rounded-xl transition shadow-sm"
                            >
                                <Music className="w-5 h-5" /> 내 컴퓨터 MP3 선택
                            </button>
                        </div>

                        {/* 현재 음악 상태 표시 */}
                        <div className="mt-6 text-center">
                            {musicMode !== 'default' ? (
                              <div className="flex flex-col items-center gap-1">
                                <p className="text-green-600 font-bold text-sm md:text-base bg-green-100 px-4 py-2 rounded-full inline-flex items-center justify-center gap-2 w-full truncate">
                                    {musicMode === 'youtube' ? <YoutubeIcon className="w-5 h-5 text-red-500 flex-shrink-0"/> : <Music className="w-5 h-5 flex-shrink-0"/>}
                                    <span className="truncate">현재 음악: {musicName}</span>
                                </p>
                                <button onClick={handleResetMusic} className="text-xs text-gray-500 underline hover:text-gray-700 mt-2">
                                  초기화 (선생님 기본 배경음 사용)
                                </button>
                              </div>
                            ) : (
                              <p className="text-gray-400 text-sm mt-2">설정 안 함 (기본 배경음 재생)</p>
                            )}
                        </div>
                      </div>

                      {/* [패널 2] 청소 구역 이미지 업로드 */}
                      <div className="p-6 bg-gray-50 rounded-3xl border border-gray-200 shadow-inner text-left flex flex-col h-full justify-between">
                        <div>
                            <p className="text-xl text-gray-700 mb-4 text-center">📋 우리 반 청소 구역표 등록</p>
                            <input type="file" accept="image/*" onChange={handleImageUpload} ref={imgInputRef} className="hidden" />
                            <button 
                                onClick={() => { if (imgInputRef.current) imgInputRef.current.click(); }}
                                className="flex items-center justify-center gap-2 w-full bg-white border-2 border-emerald-400 text-emerald-500 hover:bg-emerald-50 py-3 px-6 rounded-xl transition shadow-sm"
                            >
                                <ImageIcon className="w-5 h-5" /> 컴퓨터에서 이미지 선택하기
                            </button>
                        </div>
                        
                        <div className="flex flex-col items-center justify-center mt-4 flex-1">
                            {cleaningImg ? (
                                <div className="flex flex-col items-center gap-3 w-full">
                                    <div className="relative w-full max-h-[140px] overflow-hidden rounded-xl border border-gray-300 shadow-sm flex justify-center bg-gray-200">
                                        <img src={cleaningImg} alt="청소 구역 미리보기" className="h-[140px] w-auto object-contain" />
                                    </div>
                                    <button onClick={handleResetImage} className="flex items-center gap-1 text-sm text-gray-500 underline hover:text-red-500 transition">
                                      <TrashIcon className="w-4 h-4" /> 이미지 지우기
                                    </button>
                                </div>
                            ) : (
                                <p className="text-gray-400 text-sm text-center">이미지를 올리면 타이머 화면 오른쪽에<br/>청소 구역이 계속 띄워져 있게 됩니다!</p>
                            )}
                        </div>
                      </div>
                  </div>

                  <button onClick={() => setStarted(true)} className="bg-blue-400 hover:bg-blue-500 text-white text-3xl py-5 px-12 rounded-full shadow-lg transform transition hover:scale-105 hover:-translate-y-1 w-full mt-auto">
                    청소 시작하기 🚀
                  </button>
                </div>
              )}

              {/* ======================= 진행 & 완료 화면 ======================= */}
              {started && (
                <div className="flex flex-col lg:flex-row gap-8 items-center justify-center w-full max-w-[90rem] mt-28 md:mt-0 z-10 px-4">
                  
                  {/* [좌측] 타이머 & 완료 박스 */}
                  <div className="flex-1 flex justify-center w-full min-w-0">
                    {currentStep < steps.length ? (
                      <div className="bg-white/90 backdrop-blur-md rounded-[3rem] p-8 md:p-12 shadow-2xl text-center w-full max-w-3xl border-4 border-white relative overflow-hidden animate-fade-in-up">
                        <div className="absolute top-0 left-0 h-3 bg-gray-100 w-full">
                          <div className="h-full bg-blue-400 transition-all duration-1000" style={{ width: `${((currentStep + 1) / steps.length) * 100}%` }}></div>
                        </div>
                        <div className="mt-4 mb-4">
                          <span className="bg-white text-blue-500 px-6 py-2 rounded-full text-2xl font-bold shadow-sm border-2 border-blue-100">{currentStep + 1} / {steps.length} 단계</span>
                        </div>
                        <h2 className="text-4xl md:text-5xl text-gray-800 mt-8 mb-4 leading-tight break-keep">{steps[currentStep].title}</h2>
                        <div className="text-7xl mb-8 animate-bounce">{steps[currentStep].emoji}</div>
                        <div className="my-8 relative">
                          <div className="text-8xl md:text-9xl font-bold text-gray-700 drop-shadow-md tracking-wider">{formatTime(timeLeft)}</div>
                          <div className="w-full bg-gray-100 h-4 rounded-full mt-8 overflow-hidden">
                            <div className="h-full bg-pink-400 transition-all duration-1000 rounded-full" style={{ width: `${(timeLeft / steps[currentStep].time) * 100}%` }}></div>
                          </div>
                        </div>
                        <div className="flex items-center justify-center gap-6 mt-10">
                          <button onClick={handlePrev} disabled={currentStep === 0} className={`p-4 rounded-full transition-transform hover:scale-110 shadow-md ${currentStep === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-gray-50'}`}>
                            <SkipBack className="w-8 h-8 md:w-10 md:h-10" />
                          </button>
                          <button onClick={() => setIsPaused(!isPaused)} className="bg-yellow-400 hover:bg-yellow-500 text-white p-6 rounded-full shadow-lg transition-transform hover:scale-110">
                            {isPaused ? <Play className="w-12 h-12 md:w-14 md:h-14 fill-white" /> : <Pause className="w-12 h-12 md:w-14 md:h-14 fill-white" />}
                          </button>
                          <button onClick={handleNext} className="p-4 rounded-full bg-white text-gray-700 hover:bg-gray-50 shadow-md transition-transform hover:scale-110">
                            <SkipForward className="w-8 h-8 md:w-10 md:h-10" />
                          </button>
                        </div>
                      </div>
                    ) : (
                      <div className="bg-white/95 backdrop-blur-md rounded-[3rem] p-12 shadow-2xl text-center w-full max-w-2xl border-4 border-green-200 animate-fade-in-up">
                        <div className="flex justify-center mb-8"><CheckCircle2 className="w-24 h-24 text-green-500" /></div>
                        <h1 className="text-4xl md:text-5xl text-green-600 mb-8 leading-snug break-keep">우리 반을 깨끗하게 해줘서<br/>고마워! 💖</h1>
                        <p className="text-3xl text-gray-700 mb-12 bg-green-50 p-6 rounded-2xl break-keep">점심 맛있게 먹고<br/>5교시 수업을 준비해주세요! 🍱</p>
                        <button onClick={handleRestart} className="flex items-center justify-center gap-3 bg-gray-800 hover:bg-gray-900 text-white text-2xl py-4 px-10 rounded-full mx-auto shadow-xl transition transform hover:scale-105">
                          <RefreshCw className="w-7 h-7" /> 처음부터 다시 하기
                        </button>
                      </div>
                    )}
                  </div>

                  {/* [우측] 청소 구역 이미지 패널 (이미지가 업로드 된 경우에만 표시) */}
                  {cleaningImg && (
                    <div className="w-full lg:w-[450px] xl:w-[500px] bg-white/90 backdrop-blur-md rounded-[3rem] p-6 shadow-2xl border-4 border-white flex flex-col items-center animate-fade-in-up flex-shrink-0 lg:max-h-[85vh]">
                        <div className="bg-emerald-100 text-emerald-700 font-bold px-8 py-3 rounded-full mb-4 text-2xl shadow-sm border-2 border-emerald-200 flex-shrink-0 whitespace-nowrap">
                            📋 이달의 청소 구역
                        </div>
                        {/* 이미지 영역 (가로/세로 비율을 최대한 유지하며 넘칠 경우 안에서만 스크롤 되도록 설정) */}
                        <div className="w-full flex-1 overflow-y-auto rounded-2xl bg-gray-50 flex items-start justify-center p-2 border border-gray-200 hide-scrollbar shadow-inner">
                            <img src={cleaningImg} alt="청소 구역" className="w-full h-auto rounded-xl object-contain" />
                        </div>
                    </div>
                  )}

                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
